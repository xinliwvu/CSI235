/* ---------- 1–5: frame ---------- */
S({kind:'title', title:'AlphaFold',
  html:`<div class="rule"></div>
   <h1 class="big">When AI became<br>a scientific instrument.</h1>
   <p class="lead" style="margin-top:14px">A follow-up to <i>AI and Lost Knowledge</i>: what changes when AI does not retrieve information, but makes a new scientific object visible?</p>
   <img src="${IMG.af_hero}" alt="Stylised illustration: a scientific instrument turning a sequence of letters into a molecular structure" style="width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:14px;border:1px solid var(--rule)">
   <div class="meta">
     <div><b>Course</b>CSI-235 · AI for All · UAlbany</div>
     <div><b>Story</b>A 50-year problem, a blind benchmark, and a 2024 Nobel Prize</div>
     <div><b>Prerequisite</b>none — no biology or chemistry assumed</div>
   </div>`,
  notes:`Open with the question in the subtitle and leave it unanswered. Come back to it on slide 40.<br>Reassure non-majors immediately: nothing today requires biology. Source: ${SRC.af2}`}),

S({kind:'content', eyebrow:'Bridge from last lecture', title:'From lost knowledge to hidden structure',
  html:`<div class="cols" style="gap:22px">
    <div class="card"><h3>Herculaneum</h3><p class="small">Ancient writing is <b>physically present</b> but inaccessible inside a carbonized scroll. AI helps recover a signal that survived time.</p></div>
    <div class="card"><h3>AlphaFold</h3><p class="small">A protein sequence is <b>known</b>, but its 3-D structure may be unknown. AI helps infer a structure latent in the sequence and the evolutionary record.</p></div>
  </div>
  <div class="card" style="margin-top:14px;border-color:var(--dusk)"><h3 style="color:var(--dusk)">The shared idea</h3>
    <p class="small">AI becomes powerful when reality leaves <em class="key">traces</em> too complex for humans to decode unaided: <b>trace → model → hypothesis → validation</b>. Last week the trace was physical and we excavated it. This week the trace is statistical and we infer from it — which is a weaker kind of evidence, and the whole lecture turns on that difference.</p></div>`,
  notes:`Emphasise the shift: AlphaFold <b>infers</b> rather than excavates. There is no scan of the protein. That distinction is what makes confidence estimates (slide 22) essential rather than decorative.`}),

S({kind:'content', eyebrow:'The grand challenge', title:'The question that occupied biology for fifty years',
  html:`<div class="stack">
    <p class="quote">Can we predict a protein’s 3-D shape from its amino-acid sequence?</p>
    <div class="aarow" style="margin:14px 0 6px">
      ${'MKTIIALSYIFCLVFA'.split('').map(c=>`<span class="aa">${c}</span>`).join('')}
    </div>
    <p class="small" style="color:var(--ink-3)">1-D letters &nbsp;→&nbsp; 3-D geometry</p>
    <div class="cols" style="margin-top:10px">
      <div class="stack"><div class="card"><h3>Why the question is strange</h3><p class="small">Nothing tells the chain what to become. There is no blueprint inside the cell reading the sequence and assembling the shape — the chain finds it, in milliseconds, every time.</p></div></div>
      <div class="stack"><div class="card"><h3>Why it matters that it is repeatable</h3><p class="small">The <i>same</i> sequence reaches the <i>same</i> shape. That reproducibility is what makes prediction conceivable at all — and it is the empirical fact the whole field rests on.</p></div></div>
    </div>
  </div>`,
  notes:`Do not answer why yet — slide 4 is the pair activity. Let students propose “instructions”, “energy”, “chemistry”, “evolution”.<br>Source: ${SRC.casp}`}),

S({kind:'activity', act:'pair', title:'Why does the same chain reach the same shape?',
  timer:180,
  html:`<div class="act pair">
    <span class="chip"><span class="dot"></span>Think · Pair · Share &nbsp;·&nbsp; 3 minutes</span>
    <p class="ask">A protein is a floppy chain of amino acids. Released into water, it folds — and the <em class="key">same</em> chain reliably reaches the <em class="key">same</em> shape, in about a thousandth of a second. With a neighbour: what could possibly be making that happen?</p>
    <div class="grid3">
      <div class="card"><h3>Is something guiding it?</h3><p class="small">Is there a set of instructions somewhere, or does the chain do this alone?</p></div>
      <div class="card"><h3>Is it searching?</h3><p class="small">If it were trying shapes one by one, how long would that take?</p></div>
      <div class="card"><h3>Why is it repeatable?</h3><p class="small">What would have to be true for the answer to come out the same every time?</p></div>
    </div>
    <div data-slot="timer"></div>
  </div>`,
  reveal:`<div class="card" style="margin-top:4px"><h3>Where this lands</h3>
    <p class="small">Nothing guides it, and it is not searching. The shape is the one that is most <b>stable</b> given the physics — every amino acid has a size, a charge, and a preference for water or for hiding from it, and only a small family of arrangements satisfies all of those at once. Repeatability comes from the constraints, not from instructions.<br><br>
    That has a direct consequence for AI: if the shape is determined by the sequence, then in principle the shape is <em class="key">predictable</em> from the sequence. Fifty years of work rested on that “in principle”. <span style="color:var(--ink-3)">(Levinthal, 1969, made the search argument formal — slide 8 does the arithmetic.)</span></p></div>`,
  notes:`Take three answers before revealing. “Energy” and “chemistry” are the productive ones; “DNA tells it” is the common wrong turn and worth correcting gently — DNA specifies the sequence, not the fold.`}),

S({kind:'content', eyebrow:'Start with the basics', title:'A protein is a chain built from a 20-letter alphabet',
  html:`<div class="aarow" style="margin:6px 0 14px">
    ${'ARNDCEQGHILKMFPSTWYV'.split('').map(c=>`<span class="aa hl">${c}</span>`).join('')}
  </div>
  <div class="cols">
    <div class="stack"><p>A protein is <em class="key">not a word</em>. It is a physical molecule, and its letters have size, charge, flexibility and chemical preferences. Those properties constrain how the chain can fold.</p>
      <p class="small">The better analogy is Lego pieces with different surfaces — some sticky, some water-hating, some rigid — rather than letters on a page.</p></div>
    <div class="stack"><div class="card"><h3>Shape enables function</h3><p class="small">
      <b>Enzyme</b> — a pocket positions molecules for chemistry.<br>
      <b>Antibody</b> — a surface recognizes a target.<br>
      <b>Channel</b> — a pore controls what crosses a membrane.<br>
      <b>Motor</b> — moving parts convert energy into motion.</p></div>
      <p class="note-line">When structure changes, function can change. That is why a shape is worth predicting.</p></div>
  </div>`,
  notes:`Keep it conceptual for non-biology majors. Familiar examples: insulin, antibodies, ion channels.<br>“Sequence is information embodied in matter” is the sentence worth writing on the board.`}),

/* ---------- 6–9: why it is hard ---------- */
S({kind:'content', eyebrow:'Shape → function', title:'Why a shape is worth predicting',
  html:`<div class="grid2">
    <div class="card"><h3>Enzyme</h3><p class="small">A pocket holds two molecules in exactly the right position for a chemical reaction to happen. Change the pocket and the reaction stops.</p></div>
    <div class="card"><h3>Antibody</h3><p class="small">A surface recognizes one target out of millions by matching its shape and charge.</p></div>
    <div class="card"><h3>Channel</h3><p class="small">A pore in a membrane controls what crosses and what does not — the basis of every nerve impulse you have ever had.</p></div>
    <div class="card"><h3>Motor</h3><p class="small">Moving parts convert chemical energy into motion. Your muscles are this, several trillion times over.</p></div>
  </div>
  <p class="note-line">When structure changes, function can change — which is why a single mutation can cause a disease, and why knowing a shape changes what questions become askable.</p>`,
  notes:`Keep the examples familiar: insulin, antibodies, ion channels, muscle. Non-biology majors need one concrete image each, not a taxonomy.<br>The sickle-cell example lands well if anyone asks how one letter can matter.`}),

S({kind:'content', eyebrow:'From 1-D to 3-D', title:'The chain has to solve a geometry problem',
  html:`<div class="grid3" style="margin-top:4px">
    <div class="card"><h3>Local constraints</h3><p class="small">Bond lengths and angles restrict what is physically possible at every step.</p></div>
    <div class="card"><h3>Long-range constraints</h3><p class="small">Amino acids far apart <i>in the sequence</i> may touch in 3-D. Position 12 and position 87 can be neighbours.</p></div>
    <div class="card"><h3>Environment</h3><p class="small">Water, ions, membranes and binding partners affect which structures are stable.</p></div>
  </div>
  <div class="cols" style="margin-top:16px">
    <div class="stack"><p>This is why “turning letters into a picture” is the wrong mental model. It is a <em class="key">coupled</em> geometry problem: every choice constrains every other choice, including choices hundreds of positions away.</p></div>
    <div class="stack"><div class="card"><h3>Why scientists care</h3><p class="small">Which mutation destabilizes a protein? Where could a drug molecule bind? Which proteins share an ancient fold? Can we engineer a better enzyme? What might an uncharacterized gene do?</p></div></div>
  </div>`,
  notes:`Long-range dependency is the phrase to plant here — it comes back on slide 19 when attention appears.<br>Structure does not answer every biological question, but it changes which questions become askable.`}),

S({kind:'content', eyebrow:'The experimental route', title:'Before AlphaFold, seeing a structure meant an experiment',
  html:`<div class="grid3">
    <div class="card"><h3>X-ray crystallography</h3><p class="small">Diffract X-rays through a crystal. Powerful — but many proteins refuse to crystallize, and one structure can take months or years.</p></div>
    <div class="card"><h3>NMR spectroscopy</h3><p class="small">Infer constraints from magnetic behaviour. Works especially well for smaller systems, in solution.</p></div>
    <div class="card"><h3>Cryo-electron microscopy</h3><p class="small">Image frozen molecules with electrons. Excellent for many large complexes.</p></div>
  </div>
  <div class="card" style="margin-top:16px;border-color:var(--dusk)"><h3 style="color:var(--dusk)">Say this before anyone assumes otherwise</h3>
    <p class="small">Prediction <b>complements</b> experiment; it does not make experimental structural biology obsolete. Roughly 200,000 experimentally solved structures are what AlphaFold learned from — the training data <i>is</i> fifty years of other people's experiments.</p></div>
  <p class="credit">Source: RCSB PDB / EMBL-EBI guidance on experimental and computed structures · ${SRC.ebi}</p>`,
  notes:`Important nuance — do not let the lecture become “AI replaced the lab”. The next lecture-hall myth to head off.`}),

S({kind:'activity', act:'predict', title:'Could we just try every shape?', demo:'search',
  html:`<div class="act predict">
    <span class="chip"><span class="dot"></span>Predict → then we count</span>
    <p class="ask">Take a chain of 100 amino acids. Give each one only <b>3</b> possible local conformations — a wild simplification. Predict: could the world's fastest computer try them all?</p>
    <div class="cols wide-right"><div class="stack">
      <ul class="pts"><li>Guess an order of magnitude before you touch the slider</li><li>Then set it to 100 residues, 3 conformations</li><li>Ask what kind of clue could collapse a space this large</li></ul>
    </div><div class="demo" data-slot="demo"></div></div></div>`,
  reveal:`<div class="card" style="margin-top:2px"><h3>3¹⁰⁰ ≈ 5 × 10⁴⁷</h3>
    <p class="small">At a trillion shapes per second, the universe ends first — by a margin so large the comparison stops meaning anything. And real proteins have far more than three options per residue, yet they fold in milliseconds.<br><br>
    The lesson is not the number. It is that <em class="key">“try everything” is the wrong strategy</em>, and no amount of faster hardware rescues it. What is needed is constraints that rule out almost everything before you start — which is exactly what the next section is about. <span style="color:var(--ink-3)">(This is an intentionally simplified count, not a literal enumeration of physical states.)</span></p></div>`,
  notes:`Ask the class for “what kind of clue could collapse this?” before revealing. Answers that arrive: chemistry, known similar structures, and — if you are lucky — “look at other species”, which is coevolution and slide 16.`}),

/* ---------- 10–14: CASP and the precursor ---------- */
S({kind:'activity', act:'poll', title:'What could collapse a search space that large?',
  poll:{qid:'a0', ask:'Trying every shape is hopeless. Which kind of clue actually shrinks the problem enough to be solved?',
    opts:[
      {t:'A faster computer, or many of them in parallel', why:'Nothing available shrinks 10⁴⁷ by enough to matter. If a thousand-fold speed-up leaves you needing longer than the age of the universe, hardware is not the answer.'},
      {t:'Knowing which pairs of positions end up touching each other', why:'A handful of long-range contacts eliminates almost every arrangement at once. This is the idea AlphaFold’s predecessors were built on — and you are about to fold a chain with it yourself.', ok:true},
      {t:'Simulating the physics of folding more accurately', why:'Scientifically appealing, and it has been tried for decades. Better physics still leaves you searching an enormous space, and small force-field errors accumulate over the whole trajectory.'},
      {t:'Looking up a similar protein whose structure is already known', why:'Genuinely useful — template-based modelling worked well when a relative existed. But it fails exactly where you need it most: proteins with no solved relative.'}
    ]},
  notes:`Answer D deserves credit: it is a real method and was the state of the art for years. Draw out why it does not generalise — the useful cases are the ones without templates.`}),

S({kind:'content', eyebrow:'The benchmark', title:'CASP: a sealed exam for protein prediction',
  html:`<div class="cols wide-left"><div class="stack">
    <ul class="pts num">
      <li><b>Labs solve structures.</b> Experimental answers exist but are not yet public.</li>
      <li><b>CASP releases sequences.</b> Teams receive only the amino-acid letters.</li>
      <li><b>Teams submit predictions.</b> No peeking at the hidden answer.</li>
      <li><b>Independent scoring.</b> Predictions are compared with the real structures.</li>
    </ul>
    <p class="credit">CASP has run every two years since 1994 · ${SRC.casp}</p>
  </div><div class="stack">
    <div class="card" style="border-color:var(--dusk)"><h3 style="color:var(--dusk)">A benchmark becomes part of the scientific method</h3>
      <p class="small">Before AlphaFold, protein prediction had one enormous advantage over most of computer science: a rigorous blind test that made self-deception <b>expensive</b>. You could not tune on the answer, because you did not have it.</p></div>
    <div class="card"><h3>Compare with last lecture</h3><p class="small">The Vesuvius Challenge did the same thing for scrolls: open data, a fixed target, independent verification. Benchmarks are institutions, not files.</p></div>
  </div></div>`,
  notes:`If you taught the Lost Knowledge lecture, make the CASP ↔ Vesuvius Challenge parallel explicit — it is the strongest structural link between the two sessions.`}),

S({kind:'content', eyebrow:'1994 → 2016', title:'Steady progress, and no decisive solution',
  html:`<div class="cols wide-left"><div class="tl">
    <div class="ev"><span class="yr">1994</span><p>CASP begins — blind evaluation every two years</p></div>
    <div class="ev"><span class="yr">1990s</span><p><b>Template-based modelling</b> — if a similar structure was known, prediction could be useful</p></div>
    <div class="ev"><span class="yr">2000s</span><p><b>Physics-inspired search</b> — powerful ideas, but enormous search and scoring problems remained</p></div>
    <div class="ev"><span class="yr">2010s</span><p><b>Coevolutionary contacts</b> — sequence databases begin revealing which residues likely touch</p></div>
    <div class="ev big"><span class="yr">2018</span><p>AlphaFold 1 wins CASP13</p></div>
  </div>
  <div class="stack">
    <div class="card"><h3>The breakthrough was cumulative</h3><p class="small">AlphaFold did not emerge from an empty field. It combined decades of structural biology, sequence databases, geometry, benchmarking and machine learning — much of it built by people who never worked at DeepMind.</p></div>
    <div class="card"><h3>And then the redesign</h3><p class="small">AlphaFold 1 was already strong. AlphaFold 2 was not “bigger” — it was an <b>entirely redesigned end-to-end system</b>. Scientific breakthroughs often come from changing the <em class="key">representation</em> of the problem, not from scaling the previous one.</p></div>
  </div></div>`,
  notes:`CASP organizers explicitly framed AlphaFold as building on global community progress. Say “team science across decades” out loud.<br>Sources: ${SRC.casp} · ${SRC.af2}`}),

S({kind:'content', eyebrow:'The precursor idea', title:'Deep learning learned to predict who is near whom',
  html:`<div class="cols wide-right"><div class="stack">
    <p>Instead of searching blindly through shapes, <em class="key">learn the spatial constraints from data</em>: for every pair of positions, how likely are they to be in contact?</p>
    <div class="card"><h3>Why this changes everything</h3><p class="small">It turns folding from <b>“search everything”</b> into <b>“satisfy learned geometry”</b>. The search space does not shrink — it stops being searched at all. You go straight to the arrangement that fits the constraints.</p></div>
    <p class="small">A contact map is a simple object: a grid where cell (i, j) says whether residue i and residue j touch. Predict that grid well, and the 3-D structure is nearly determined.</p>
    <p class="credit">Senior et al., CASP13 (2019) · ${SRC.af2}</p>
  </div>
  <figure class="shot fit"><img src="${IMG.af_band}" alt="Stylised illustration of a predicted contact map feeding into a molecular structure">
    <figcaption>Learned constraints, not blind search</figcaption></figure></div>`,
  notes:`This slide sets up the interactive demo two slides on, where students place constraints and watch a chain fold to satisfy them.`}),

S({kind:'activity', act:'predict', title:'Fold a chain by satisfying constraints', demo:'fold',
  html:`<div class="act predict">
    <span class="chip"><span class="dot"></span>Predict → then we run it</span>
    <p class="ask">Below is a floppy chain and a grid of possible contacts. Click cells to declare “these two positions touch”. Predict: <em class="key">how many constraints</em> does it take before the shape stops being ambiguous?</p>
    <div class="cols wide-right"><div class="stack">
      <ul class="pts"><li>Add one contact — does the chain settle?</li><li>Add a few more — when does it lock?</li><li>Press <b>shuffle</b>: does it return to the same shape?</li></ul>
      <p class="small">This is not AlphaFold's algorithm. It is the idea underneath it: constraints in, geometry out.</p>
    </div><div class="demo" data-slot="demo"></div></div></div>`,
  reveal:`<div class="card" style="margin-top:2px"><h3>Surprisingly few — and that is the whole trick</h3>
    <p class="small">A handful of well-chosen long-range contacts collapses an astronomically large space to essentially one shape. That is why predicting <em class="key">who touches whom</em> is worth more than simulating the folding process: the contacts are a compact description of the answer.<br><br>
    Note what the demo also shows: with too few constraints the chain settles into a <i>different</i> shape each time you shuffle. Ambiguity in the constraints appears as instability in the result — which is exactly the signal a confidence score should report.</p></div>`,
  notes:`Let a student drive. The “shuffle gives a different answer when under-constrained” behaviour is a gift — it makes the case for confidence estimates before you ever mention pLDDT.`}),

/* ---------- 14–22: how AlphaFold2 thinks ---------- */
S({kind:'content', eyebrow:'The 100-word version', title:'AlphaFold in plain English',
  html:`<div class="cols wide-left"><div class="stack">
    <p style="font-size:19px;line-height:1.45">AlphaFold is an AI system that predicts a protein's 3-D shape from its amino-acid sequence. Proteins begin as long chains, but fold into complex shapes that determine how they function. AlphaFold learns patterns from known protein structures and from evolution, where changes at one amino-acid position can reveal which parts of a protein interact. It combines these clues to estimate which amino acids should be close together in space, then builds a likely 3-D structure. Instead of simulating every step of folding, it predicts the final shape directly — often with very high accuracy.</p>
  </div><div class="stack">
    <div class="card" style="border-color:var(--dusk)"><h3 style="color:var(--dusk)">The core idea, in five words</h3>
      <p style="font-size:19px;margin:6px 0 0">learn constraints → build geometry → refine → report confidence</p></div>
    <p class="small">Each of those four steps gets one slide. The goal is not to reproduce the architecture — it is to see why the design is clever.</p>
    <p class="credit">${SRC.ebi} · ${SRC.af2}</p>
  </div></div>`,
  notes:`Read the paragraph aloud once, then unpack it over the next six slides. Tell students this is the version to repeat at dinner.`}),

S({kind:'content', eyebrow:'Coevolution', title:'Evolution leaves clues in the sequence',
  html:`<div class="cols"><div class="stack">
    <p>Suppose two amino acids touch in 3-D. If a mutation makes one of them larger, evolution may favour a <em class="key">compensating</em> change at the position it touches — otherwise the protein stops working and the organism does not pass it on.</p>
    <p class="small">Across thousands of related species, positions that change <b>together</b> reveal hidden physical relationships. Nobody labelled them. The pattern is simply preserved in the sequence record.</p>
  </div><div class="stack">
    <div class="card"><h3>The detective question</h3><p class="small">Why is evolution useful training data even though nobody ever wrote down “these two residues touch”?<br><br><b>Because selection did the labelling.</b> Pairs that had to stay compatible left a statistical fingerprint; pairs that were independent did not.</p></div>
    <div class="card"><h3>The caution</h3><p class="small">Correlation is not contact. Positions can co-vary for reasons that have nothing to do with touching — shared ancestry, shared function, sampling bias. AlphaFold combines coevolution with many other cues rather than trusting it alone.</p></div>
  </div></div>`,
  notes:`Do not oversimplify to “correlation = contact”. The caution card is the part that makes this a science lecture rather than a magic trick.<br>Source: ${SRC.ebi}`}),

S({kind:'content', eyebrow:'The MSA', title:'Put evolutionary cousins side by side',
  html:`<div class="cols wide-left"><div class="stack">
    <pre class="code sm"><span class="c">           position →   1  2  3  4  5  6  7  8</span>
species 1    M  K  T  I  A  V  A  G
species 2    M  R  T  I  A  V  S  G
species 3    M  K  T  V  A  V  G  G
species 4    L  K  T  I  A  V  A  G
species 5    M  K  S  I  A  V  G  G
species 6    M  R  V  I  A  V  A  G</pre>
    <p class="codecap">A multiple sequence alignment — rows are related species, columns are corresponding positions.</p>
  </div><div class="stack">
    <div class="card"><h3>What the AI sees</h3><p class="small">Not one protein, but a <em class="key">population</em> of variants of the same protein, lined up. Patterns across millions of such sequences reveal evolutionary constraints that a single sequence cannot.</p></div>
    <div class="card"><h3>Read a column</h3><p class="small">Column 5 never changes — it is probably essential, and it tells you nothing about <i>pairs</i>. Columns that vary are where the information about coupling lives.</p></div>
  </div></div>`,
  notes:`This is a schematic alignment, not a real protein — say so.<br>Make sure they see that a perfectly conserved column carries no pairwise information, or the next demo will confuse them.`}),

S({kind:'activity', act:'predict', title:'Find the pair that changes together', demo:'msa',
  html:`<div class="act predict">
    <span class="chip"><span class="dot"></span>Predict → then we measure</span>
    <p class="ask">Here is a multiple sequence alignment: rows are related species, columns are corresponding positions. Predict which two columns are <em class="key">coevolving</em> — then click a pair and the panel will score it.</p>
    <div class="cols wide-right"><div class="stack">
      <ul class="pts"><li>Click one column, then another, to test a pair</li><li>Look for columns that vary — but vary <b>in step</b></li><li>A column that never changes tells you nothing</li></ul>
      <p class="small">What structural hypothesis would you test if you found such a pair?</p>
    </div><div class="demo" data-slot="demo"></div></div></div>`,
  reveal:`<div class="card" style="margin-top:2px"><h3>What the score means — and what it does not</h3>
    <p class="small">High mutual dependence between two columns is <b>evidence</b> that those positions are physically coupled — a hypothesis worth testing, and exactly the kind of signal AlphaFold learns to exploit across millions of sequences.<br><br>
    It is not proof. Two columns can move together because both track the species' lineage, or because both respond to the same environment. This is why the model does not simply read contacts off a correlation table: it learns, from structures it has seen, which correlation patterns actually correspond to contact. <em class="key">The training data teaches it when to believe the statistics.</em></p></div>`,
  notes:`This is a schematic alignment, not a real protein — say so. The purpose is to make coevolution visible and tangible, and to let students feel that a conserved column carries no information.`}),

S({kind:'activity', act:'pair', title:'Who labelled the training data?', timer:180,
  html:`<div class="act pair">
    <span class="chip"><span class="dot"></span>Think · Pair · Share &nbsp;·&nbsp; 3 minutes</span>
    <p class="ask">Nobody ever wrote down “residue 12 touches residue 87” for the millions of sequences AlphaFold learned from. So why is the evolutionary record <em class="key">useful training data</em> at all?</p>
    <div class="grid3">
      <div class="card"><h3>Consider</h3><p class="small">What happens to an organism whose protein stops working?</p></div>
      <div class="card"><h3>Consider</h3><p class="small">Which sequences survive long enough to appear in a database?</p></div>
      <div class="card"><h3>Then ask</h3><p class="small">Where else does the world label data for you, without anyone deciding to?</p></div>
    </div>
    <div data-slot="timer"></div>
  </div>`,
  reveal:`<div class="card" style="margin-top:4px"><h3>Selection did the labelling</h3>
    <p class="small">Every sequence in the database is one that <b>worked</b> — its organism survived and reproduced. Variants that broke the protein are absent. So the database is not a neutral sample of possible sequences; it is a record of which combinations are compatible, filtered over billions of years by consequences.<br><br>
    That is a general and slightly unsettling idea: <em class="key">data can carry labels that nobody wrote</em>, because some process in the world already selected it. Web text is filtered by what people bothered to publish; clinical records by who reached a doctor. The filter is information — and it is also bias, depending on what you are asking.</p></div>`,
  notes:`The last line is the transferable one, and it connects directly to the survivorship problem in the debug slide near the end of the lecture.`}),

S({kind:'content', eyebrow:'Two spaces at once', title:'Sequences on one side, pairs on the other',
  html:`<div class="cols" style="gap:20px">
    <div class="card"><h3>MSA representation</h3><p class="small">What patterns appear across related sequences? Which positions vary? Which combinations recur? What is evolution telling us?</p></div>
    <div class="card"><h3>Pair representation</h3><p class="small">For every residue pair <i>i, j</i>: how likely are they to be near each other? What orientation and geometry are plausible?</p></div>
  </div>
  <div class="chain" style="margin-top:18px">
    <div class="lk"><b>MSA</b><span>evolutionary patterns</span></div>
    <div class="ar">⇄</div>
    <div class="lk ai"><b>Evoformer</b><span>information flows both ways, repeatedly</span></div>
    <div class="ar">⇄</div>
    <div class="lk"><b>Pairs</b><span>geometric hypotheses</span></div>
  </div>
  <p class="note-line">Each representation improves the other: a geometric hypothesis changes which sequence patterns look meaningful, and vice versa. Neither is computed once and handed over.</p>
  <p class="credit">The Nature paper describes the Evoformer as jointly embedding MSA and pairwise features · ${SRC.af2}</p>`,
  notes:`Students do not need the architecture. They need the idea that two <i>different kinds of thing</i> are refined together — which is genuinely unusual and worth a minute.`}),

S({kind:'content', eyebrow:'A familiar AI idea', title:'Attention asks: what should influence what?',
  html:`<div class="cols" style="gap:22px">
    <div class="card"><h3>In language</h3><p class="small">“The <b>bank</b> by the <b>river</b>…” — words use other words as context, and which words matter changes from sentence to sentence.</p></div>
    <div class="card"><h3>In proteins</h3><p class="small">Residues and evolutionary patterns use <b>distant</b> residues as context — position 12 attends to position 87 because the geometry says they matter to each other.</p></div>
  </div>
  <p style="margin-top:16px">Same general computational idea: <em class="key">dynamically weight the relevant relationships</em> instead of fixing them in advance.</p>
  <div class="card" style="border-color:var(--debug)"><h3 style="color:var(--debug)">But say this clearly</h3>
    <p class="small">AlphaFold is <b>not</b> a language model. It does not generate text, it was not trained to predict the next token, and a protein is not a sentence. It borrows one architectural component — attention — and uses it on a completely different object. Keep the analogy at the level of “dynamic information routing” and no further.</p></div>`,
  notes:`Students arrive assuming everything is ChatGPT. This slide exists to hold that line, and it is worth being firm about.`}),

S({kind:'content', eyebrow:'Iterative reasoning', title:'Recycling: predict, look again, refine',
  html:`<div class="chain" style="margin:8px 0 18px">
    <div class="lk"><b>1 · Clues</b><span>MSA + pairs</span></div><span class="ar">→</span>
    <div class="lk"><b>2 · Structure</b><span>a first 3-D guess</span></div><span class="ar">→</span>
    <div class="lk"><b>3 · Feed back</b><span>the guess re-enters as input</span></div><span class="ar">→</span>
    <div class="lk ai"><b>4 · Refine</b><span>a better structure — then again</span></div>
  </div>
  <div class="cols">
    <div class="stack"><p>AlphaFold is <em class="key">not</em> a single pass from sequence to answer. Its own output becomes an input, several times over.</p>
      <p class="small">The paper calls this <b>recycling</b>, and reports that it contributes markedly to accuracy.</p></div>
    <div class="stack"><div class="card"><h3>Then geometry enters explicitly</h3><p class="small">A dedicated <b>structure module</b> turns pairwise hypotheses — “residue 12 should be near 87; residue 25 has a preferred orientation relative to 41” — into actual atomic coordinates, in a way that respects rotations and translations of the whole molecule.</p></div></div>
  </div>
  <p class="credit">Source: ${SRC.af2}</p>`,
  notes:`“Respects rotations and translations” means: rotate the protein and the prediction rotates with it, rather than changing. Worth one sentence — students find it intuitive once said.`}),

S({kind:'activity', act:'poll', title:'Is a high-confidence prediction the truth?', demo:'plddt',
  poll:{qid:'a1', ask:'AlphaFold reports <b>pLDDT</b>, a per-residue confidence from 0 to 100. A region scores 95. What does that entitle you to say?',
    opts:[
      {t:'This region’s structure is now known — it can be treated as ground truth', why:'No. It is a confidence estimate produced by the same system making the prediction. The paper shows pLDDT correlates well with actual accuracy — correlation with truth is not truth.'},
      {t:'This is a strong structural hypothesis, good enough to design an experiment around', why:'The honest reading. High pLDDT regions are reliable enough to guide real work — molecular replacement, drug hypotheses, mutation analysis — while remaining predictions that an experiment could overturn.', ok:true},
      {t:'The model is 95% likely to be exactly right', why:'pLDDT is not a probability of correctness. It is a predicted score for how well the local structure would match an experimental one — a different quantity with a different scale.'},
      {t:'Nothing — confidence scores from AI are meaningless', why:'Too cynical, and it throws away real information. A calibrated confidence estimate is one of the most scientifically useful things a model can output; the error is treating it as a verdict rather than a caveat.'}
    ]},
  html:`<div class="cols wide-right" style="margin-top:8px"><div class="stack">
      <p class="small">The panel colours a predicted chain by confidence. Low-confidence regions are not necessarily <i>errors</i> — they often mark parts that are genuinely floppy, or where too few evolutionary relatives exist to constrain the answer.</p>
    </div><div class="demo" data-slot="demo"></div></div>`,
  notes:`The scientific habit to name: ask not only “what did the model predict?” but “<b>how much should I trust each part?</b>”<br>Point out on the panel that a disordered tail scores low <i>correctly</i> — the model is right to be unsure. Sources: ${SRC.af2}`}),

/* ---------- 23–27: CASP14 and the nuance ---------- */
S({kind:'content', eyebrow:'The moment of truth', title:'CASP14, 2020: structures it had not seen',
  html:`<div class="cols wide-right"><div class="stack">
    <p class="lead">No curated demo. No cherry-picked examples. A blind scientific test against hidden experimental answers.</p>
    <div class="stats" style="margin:16px 0">
      <div class="stat"><span class="v">0.96 Å</span><span class="l">AlphaFold2 median backbone error</span></div>
      <div class="stat"><span class="v">2.8 Å</span><span class="l">next-best method</span></div>
      <div class="stat"><span class="v">~⅔</span><span class="l">of targets scoring GDT above 90</span></div>
    </div>
    <p class="credit">Nature 596, 583–589 (2021) · CASP14 official results · ${SRC.af2}</p>
  </div>
  <div class="stack">
    <div class="card" style="border-color:var(--dusk)"><h3 style="color:var(--dusk)">For scale</h3>
      <p class="small">A carbon atom is about <b>1.4 Å</b> wide. A median error of 0.96 Å means the typical prediction was wrong by less than the width of one atom.<br><br>That is why the result felt <em class="key">qualitatively</em> different rather than incrementally better: many predictions had reached experimental accuracy.</p></div>
    <div class="card"><h3>Why the blind test matters here</h3><p class="small">Any method can look excellent on data it was tuned against. This number means something precisely <b>because</b> nobody could see the answers.</p></div>
  </div></div>`,
  notes:`Let the atom comparison land. Then note that a discontinuous jump in a mature field is rare — most progress is a few percent per cycle.`}),

S({kind:'activity', act:'predict', title:'What does “near-experimental accuracy” look like?', demo:'rmsd',
  html:`<div class="act predict">
    <span class="chip"><span class="dot"></span>Predict → then we overlay them</span>
    <p class="ask">A prediction is scored by superposing it on the hidden experimental structure and measuring the average distance. Predict: at <b>2.8 Å</b> — the previous best — would you be able to see the difference? What about at <b>0.96 Å</b>?</p>
    <div class="cols wide-right"><div class="stack">
      <ul class="pts"><li>Drag the error from 0 to 5 Å</li><li>Find where the two chains visibly separate</li><li>Remember: a carbon atom is 1.4 Å wide</li></ul>
    </div><div class="demo" data-slot="demo"></div></div></div>`,
  reveal:`<div class="card" style="margin-top:2px"><h3>The gap between 2.8 and 0.96 is a change of kind</h3>
    <p class="small">At 2.8 Å the overall fold is right and the details are not: you can see the shape but you cannot trust an individual side chain, which is exactly what you need for drug binding or mutation analysis. At 0.96 Å — below the width of one atom — the prediction can be used the way an experimental structure is used.<br><br>
    That is why CASP14 felt discontinuous rather than incremental. The number did not just improve; it crossed the threshold where the output becomes usable for a different set of jobs. <span style="color:var(--ink-3)">(This panel is a conceptual illustration, not a specific CASP target.)</span></p></div>`,
  notes:`Have them commit to a guess for “where can you see it?” before dragging. Most say 1 Å; the honest answer is that the fold survives well past 3 Å and the <i>details</i> do not survive past about 1.5 Å.`}),

S({kind:'activity', act:'debug', title:'This evaluation is broken. Find the flaw.',
  html:`<div class="act debug">
    <span class="chip"><span class="dot"></span>Debug this · 3 minutes with a neighbour</span>
    <div class="cols wide-left">
      <pre class="code"><span class="c"># a lab evaluates its new structure-prediction model</span>

structures = load_all_known_structures()      <span class="c"># ~200,000 from the PDB</span>
model      = train(structures)

test_set   = random_sample(structures, <span class="s">500</span>)   <span class="c"># hold out 500</span>
score      = evaluate(model, test_set)

print(score)   <span class="c"># 0.94 — "near-experimental accuracy!"</span></pre>
      <div class="stack">
        <p>The lab announces a breakthrough. CASP scores it far lower a year later.</p>
        <ul class="pts"><li>Where did the test set come from?</li><li>What has the model already seen?</li></ul>
      </div>
    </div>
  </div>`,
  reveal:`<div class="cols wide-left" style="margin-top:6px">
    <pre class="code sm">test_set = random_sample(<mark>structures</mark>, 500)   <span class="c"># drawn from the training data</span>
model    = train(<mark class="ok">structures - test_set</mark>)      <span class="c"># fix 1: hold out BEFORE training</span>
<span class="c"># fix 2: proteins similar to training ones must go too —</span>
<span class="c">#        random splitting is not enough when relatives exist</span></pre>
    <div class="card"><h3>Two bugs, one lesson</h3><p class="small">The obvious one: the test proteins were in the training set, so the score measures memory, not prediction.<br><br>
    The subtle one, which matters more here: even a proper random split leaks, because protein families contain close relatives. Hold out a protein and its cousin remains in training — the model has effectively seen the answer. CASP avoids both by using structures that <b>did not exist publicly</b> when predictions were made. That is not a stricter split; it is a different <em class="key">kind</em> of guarantee, and it is why a benchmark that controls time is worth more than one that controls sampling.</p></div></div>`,
  notes:`Connect to the ink-detector bug from the Lost Knowledge lecture: both are cases where <b>a better score means you are measuring the wrong thing</b>.<br>If students have done any ML, ask what the equivalent leak is in their own projects.`}),

S({kind:'activity', act:'poll', title:'Did AlphaFold “solve protein folding”?',
  poll:{qid:'a2', ask:'CASP organizers described the problem as “largely solved for single proteins”. Which reading of that sentence is most defensible?',
    opts:[
      {t:'Yes — protein folding is solved; the remaining work is engineering', why:'Overclaims badly. Proteins move, switch conformations, bind partners, respond to their environment, and some are intrinsically disordered. A static structure is not a theory of folding.'},
      {t:'Structure prediction was transformed for a large class of proteins — which is not the same as solving folding', why:'The careful reading, and the one CASP’s own wording supports. Single-protein structure prediction became dramatically more accurate and practically useful. That is an enormous result without claiming all of protein biophysics is done.', ok:true},
      {t:'No — it fails on many cases, so the claim is hype', why:'Under-claims. A median error below the width of a carbon atom on blind targets is not hype, and dismissing it makes it harder to notice the real limitations.'},
      {t:'The question is unanswerable — “solved” means whatever you want', why:'Tempting, and lazy. “Solved” has a defensible meaning here: on a specific blind benchmark, for single proteins, accuracy reached the experimental range. Naming the boundary conditions is the work.'}
    ]},
  notes:`This is the media-literacy slide of the AlphaFold lecture: <b>celebrate the breakthrough without erasing the boundary conditions.</b><br>Have students write the one-sentence version they would put in a news story. Source: ${SRC.casp}`}),

S({kind:'content', eyebrow:'From paper to public resource', title:'A prediction becomes infrastructure',
  html:`<div class="cols wide-left"><div class="stack">
    <div class="grid3">
      <div class="card"><h3>Open code</h3><p class="small">Researchers could inspect, run and build on the inference pipeline.</p></div>
      <div class="card"><h3>AlphaFold DB</h3><p class="small">DeepMind and EMBL-EBI began releasing predicted structures at scale.</p></div>
      <div class="card"><h3>A new workflow</h3><p class="small">Look up a structure in seconds → form a hypothesis → design the experiment.</p></div>
    </div>
    <div class="stats" style="margin-top:18px">
      <div class="stat"><span class="v">&gt;200M</span><span class="l">predicted structures in AlphaFold DB</span></div>
      <div class="stat"><span class="v">&gt;3M</span><span class="l">users by October 2025</span></div>
      <div class="stat"><span class="v">&gt;190</span><span class="l">countries</span></div>
    </div>
  </div><div class="stack">
    <div class="card" style="border-color:var(--dusk)"><h3 style="color:var(--dusk)">Not the same thing</h3>
      <p class="small">About <b>200,000</b> experimentally determined structures. Over <b>200 million</b> predictions. A thousandfold more entries — and every one of them is a hypothesis, not a measurement. Coverage is not evidence.</p></div>
    <p class="note-line">Open data trained AlphaFold. Open predictions multiplied its impact. The virtuous cycle is part of the result.</p>
    <p class="credit">${SRC.afdb} · EMBL partnership update, 2025</p>
  </div></div>`,
  notes:`Do not present the comparison as a literal current PDB count — it is a scale illustration.<br>“Coverage is not evidence” is the line to leave on the board.`}),

/* ---------- 28–33: impact ---------- */
S({kind:'activity', act:'debug', title:'Debug this citation',
  html:`<div class="act debug">
    <span class="chip"><span class="dot"></span>Debug this · 2 minutes with a neighbour</span>
    <div class="cols wide-left">
      <div class="card" style="border-color:var(--debug);background:rgba(163,50,68,.05)">
        <p class="small" style="margin:0 0 8px;color:var(--ink-3)">From a student’s draft paper:</p>
        <p style="font-size:19px;line-height:1.45;margin:0">“The structure of protein X <b>shows</b> a deep binding pocket near residue 240 (AlphaFold DB, AF-Q9Y2X3-F1), <b>confirming</b> that the drug binds at this site.”</p></div>
      <div class="stack">
        <p>Two words are doing work the evidence cannot support.</p>
        <ul class="pts"><li>Which two — and what should replace them?</li><li>What single number, present in the database entry, is missing from the sentence?</li></ul>
      </div>
    </div>
  </div>`,
  reveal:`<div class="cols wide-left" style="margin-top:4px">
    <div class="card"><h3>The fix</h3><p class="small">“The <b>predicted</b> structure of protein X <b>suggests</b> a deep pocket near residue 240 (AlphaFold DB, AF-Q9Y2X3-F1, pLDDT 71 in this region), <b>consistent with</b> — but not evidence for — binding at this site.”</p></div>
    <div class="card"><h3>Why it matters more than pedantry</h3><p class="small"><b>“Shows”</b> claims an observation; the database contains a prediction. <b>“Confirming”</b> claims the structure tested the binding hypothesis; it cannot, because nothing was measured.<br><br>And the missing number is the confidence: a pocket at pLDDT 71 is a plausible hypothesis, while the same sentence at pLDDT 45 is close to meaningless. <em class="key">The confidence score is part of the citation</em> — dropping it is like citing a measurement without its error bar.</p></div></div>`,
  notes:`This is the most immediately practical slide in the lecture for anyone who will write a lab report or thesis.<br>Ask whether they have seen the same move in a news story — “scientists show” for a modelling result is everywhere.`}),

S({kind:'content', eyebrow:'Impact 1 · AI + lab, not AI vs lab', title:'Prediction can accelerate experiment',
  html:`<div class="grid3">
    <div class="card"><h3>Molecular replacement</h3><p class="small">A predicted structure can provide the starting model that lets X-ray crystallography data be solved at all.</p></div>
    <div class="card"><h3>Cryo-EM interpretation</h3><p class="small">Predicted domains help fit and interpret density maps in large molecular machines.</p></div>
    <div class="card"><h3>Hypothesis generation</h3><p class="small">Prediction narrows the search space so experiments can test more focused questions.</p></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>The pattern to notice</h3>
    <p class="small">In every case the prediction is an <em class="key">input to an experiment</em>, not a substitute for one. This is the same shape as the papyrologist reading the ink map: the model produces a candidate, and the established method decides.</p></div>
  <p class="credit">Source: EMBL-EBI training on how scientists use AlphaFold · ${SRC.ebi}</p>`,
  notes:`Molecular replacement is the most concrete example: crystallographers had datasets they could not solve for years, and a predicted model unlocked them in an afternoon.`}),

S({kind:'content', eyebrow:'Impact 2 · Where resources are scarce', title:'Neglected-disease drug discovery',
  html:`<div class="cols wide-left"><div class="stack">
    <p>For diseases such as <b>Chagas disease</b> and <b>leishmaniasis</b>, researchers may have important drug targets with no experimentally solved structure — and limited infrastructure or funding to get one.</p>
    <div class="chain" style="margin-top:14px">
      <div class="lk ai"><b>AlphaFold</b><span>predict a plausible target structure quickly</span></div><span class="ar">→</span>
      <div class="lk"><b>Chemistry</b><span>generate molecular hypotheses</span></div><span class="ar">→</span>
      <div class="lk"><b>Experiment</b><span>test binding and biological effect</span></div><span class="ar">→</span>
      <div class="lk"><b>Iterate</b></div>
    </div>
  </div><div class="stack">
    <div class="card"><h3>Why this case matters for “AI for All”</h3><p class="small">The benefit is largest exactly where the experimental route was least affordable. A tool that removes a fixed cost redistributes who can do the science — and that is a different kind of impact from making rich labs faster.</p></div>
    <p class="credit">DNDi has used AlphaFold in programs for Chagas disease and leishmaniasis · ${SRC.dndi}</p>
  </div></div>`,
  notes:`Worth pausing on: most AI-for-science coverage measures speed. This case measures <i>access</i>. Ask students which they would rather fund.`}),

S({kind:'content', eyebrow:'Impact 3 · A new way to search', title:'Structure reveals relationships sequence hides',
  html:`<div class="cols wide-right"><div class="stack">
    <p>Two proteins can have <em class="key">very different sequences</em> and nearly the same shape — because structure is conserved long after sequence has drifted apart.</p>
    <p class="small">With hundreds of millions of predicted structures, you can search the protein universe <b>by shape</b> rather than by letters, and find distant evolutionary or functional relatives that no sequence search would return.</p>
    <div class="card"><h3>The general move</h3><p class="small">A new representation makes a new kind of question askable. Nobody could search structures at this scale before, because the structures did not exist.</p></div>
    <p class="credit">Foldseek and related tools exploit the expanded structure universe · EMBL 2023</p>
  </div>
  <figure class="shot fit"><img src="${IMG.af_band2}" alt="Stylised illustration of many molecular structures compared across a large space">
    <figcaption>Searching by shape rather than by sequence</figcaption></figure></div>`,
  notes:`If you have time: this is arguably the most under-reported consequence of AlphaFold — not any single structure, but a searchable universe of them.`}),

S({kind:'content', eyebrow:'2024', title:'AI crosses into a core science: the Nobel Prize in Chemistry',
  html:`<div class="cols" style="gap:22px">
    <div class="card"><h3>David Baker</h3><p class="small">One half — “for computational protein design”.</p></div>
    <div class="card"><h3>Demis Hassabis &amp; John Jumper</h3><p class="small">One half jointly — “for protein structure prediction”.</p></div>
  </div>
  <div class="cols" style="margin-top:16px">
    <div class="stack"><div class="card"><h3>Why Chemistry, not a computing prize?</h3>
      <p class="small">Because molecular structure <em class="key">is</em> chemistry: shape determines interactions, reactions, binding and function. The prize did not honour a neural network. It honoured a change in what molecular science can do.</p></div></div>
    <div class="stack"><p>Note the framing for your own field: the recognition came when the method changed the <b>practice</b> of an established science — not when the benchmark number moved.</p>
      <p class="credit">${SRC.nobel}</p></div>
  </div>`,
  notes:`Ask what it would take for an AI method in <i>their</i> discipline to be recognized this way. The answer is usually “when practitioners stop being able to work without it”.`}),

/* ---------- 34–40: limits, ecosystem, generalization ---------- */
S({kind:'content', eyebrow:'2024 →', title:'AlphaFold 3 broadens the alphabet',
  html:`<div class="cols wide-right"><div class="stack">
    <p>The next frontier is not the shape of one protein in isolation, but how many kinds of biological molecule <em class="key">fit together</em>.</p>
    <div class="aarow" style="margin:12px 0">
      ${['Proteins','DNA','RNA','Small molecules','Ions','Modified residues'].map(t=>`<span class="aa hl" style="width:auto;padding:0 12px;font-family:'Source Sans 3',sans-serif;font-size:14px">${t}</span>`).join('')}
    </div>
    <div class="card"><h3>An architectural shift</h3><p class="small">AlphaFold 3 uses a substantially updated, diffusion-based architecture to predict joint biomolecular complexes — a different generative approach from AlphaFold 2, aimed at a broader class of objects.</p></div>
    <p class="credit">Nature 630, 493–500 (2024) · ${SRC.af3}</p>
  </div>
  <figure class="shot fit"><img src="${IMG.af3_hero}" alt="Stylised illustration of several kinds of biological molecule interacting">
    <figcaption>From one protein to a complex</figcaption></figure></div>`,
  notes:`Keep this short — the point is direction of travel, not architecture. Interactions matter because almost nothing in a cell works alone.`}),

S({kind:'content', eyebrow:'Prediction ≠ complete biology', title:'What AlphaFold still does not give you',
  html:`<div class="grid3">
    <div class="card"><h3>Dynamics</h3><p class="small">Proteins occupy ensembles of structures and move between states. A single shape is a snapshot of something that never holds still.</p></div>
    <div class="card"><h3>Cell context</h3><p class="small">Crowding, membranes, partners and local chemistry all change behaviour.</p></div>
    <div class="card"><h3>Function</h3><p class="small">A plausible structure does not automatically reveal mechanism.</p></div>
    <div class="card"><h3>Causality</h3><p class="small">The model predicts patterns. Experiments test what actually causes an effect.</p></div>
    <div class="card"><h3>Clinical truth</h3><p class="small">Predictions are not validated medical decisions.</p></div>
    <div class="card"><h3>All interactions</h3><p class="small">Some complexes, ligands and unusual states remain genuinely hard.</p></div>
  </div>
  <p class="note-line">The scientific value of a model includes <em class="key">knowing where it fails</em>. A tool whose limits are undocumented cannot be used responsibly, however accurate it is on average.</p>`,
  notes:`Sources: RCSB structure-quality guidance · ${SRC.af3}<br>If the class remembers one slide from the second half, this is a good candidate.`}),

S({kind:'activity', act:'pair', title:'Remove one layer. Does AlphaFold still happen?', demo:'stack', timer:180,
  html:`<div class="act pair">
    <span class="chip"><span class="dot"></span>Think · Pair · Share &nbsp;·&nbsp; 3 minutes</span>
    <div class="cols wide-right"><div class="stack">
      <p class="ask" style="font-size:28px">Six layers sit beneath the phrase “AI solved it”. Click one to remove it. In threes: which layer is <em class="key">easiest to underestimate</em>?</p>
      <p class="small">Then the harder question: which of these six could a well-funded lab have built on its own, and which required decades of other people's work?</p>
    </div><div class="demo" data-slot="demo"></div></div>
    <div data-slot="timer"></div>
  </div>`,
  reveal:`<div class="card" style="margin-top:4px"><h3>The layer classes usually underestimate</h3>
    <p class="small"><b>The Protein Data Bank</b> — fifty years of experimental structures, deposited by thousands of labs under a norm of open sharing that nobody was individually rewarded for. It is not a dataset that could be bought or scraped; it had to be <em class="key">accumulated</em>, and the norm that made it open was a choice.<br><br>
    A close second is <b>CASP</b>: without a benchmark that made self-deception expensive, a strong result would have been indistinguishable from a well-tuned one. The architecture is the visible layer and the most replaceable.</p></div>`,
  notes:`This is the central “AI for science” lesson of the lecture: breakthroughs depend on the whole ecosystem, not just the architecture.<br>Source on the open-data virtuous cycle: EMBL, 2024.`}),

S({kind:'content', eyebrow:'Generalize the story', title:'AlphaFold as a template for AI in science',
  html:`<div class="chain" style="margin:8px 0 16px">
    <div class="lk"><b>1 Measure</b><span>build high-quality observations</span></div>
    <div class="lk"><b>2 Represent</b><span>find the right computational object</span></div>
    <div class="lk ai"><b>3 Learn</b><span>exploit patterns too complex for manual rules</span></div>
    <div class="lk"><b>4 Validate</b><span>blind tests and uncertainty</span></div>
    <div class="lk"><b>5 Deploy</b><span>make predictions accessible</span></div>
    <div class="lk"><b>6 Experiment</b><span>turn predictions into new science</span></div>
  </div>
  <div class="cols">
    <div class="stack"><p>The next “AlphaFold” may come from a completely different science — but the pattern may rhyme.</p>
      <p class="small">Weather. Materials. Genomics. Mathematics. Climate. Astronomy.</p></div>
    <div class="stack"><div class="card"><h3>The diagnostic question</h3><p class="small">Which of those fields has a <b>CASP</b> — a benchmark nobody can game — and which has an open, accumulated dataset the size of the PDB? Fields with both are where to look. Fields with neither will produce impressive demos and contested results.</p></div></div>
  </div>`,
  notes:`Ask the room to name a field and score it on the two criteria. It is a genuinely useful exercise and takes two minutes.`}),

S({kind:'activity', act:'debug', title:'Debug this research proposal',
  html:`<div class="act debug">
    <span class="chip"><span class="dot"></span>Debug this · 3 minutes with a neighbour</span>
    <div class="cols wide-left">
      <div class="card" style="border-color:var(--debug);background:rgba(163,50,68,.05)">
        <h3 style="color:var(--debug)">“AlphaFold for X” — a funding proposal</h3>
        <p class="small" style="margin:0">We will build a transformer that predicts <b>which drug candidates will succeed in clinical trials</b>, trained on published trial results. Following AlphaFold, we expect near-experimental accuracy. We will validate by holding out 20% of our data, and release predictions for 200 million compounds.</p></div>
      <div class="stack">
        <p>It borrows AlphaFold's vocabulary and none of its conditions.</p>
        <ul class="pts"><li>Which of the six layers is missing?</li><li>What is wrong with the validation plan?</li><li>What does “200 million predictions” buy here?</li></ul>
      </div>
    </div>
  </div>`,
  reveal:`<div class="grid2" style="margin-top:4px">
    <div class="card"><h3>No blind benchmark</h3><p class="small">There is no CASP for trial outcomes. A held-out 20% of published results is not blind: it is the same distribution, and published trials are <b>already filtered</b> by what people chose to run and report. The hardest cases are absent by construction.</p></div>
    <div class="card"><h3>No repeatable ground truth</h3><p class="small">A sequence folds the same way every time; a trial does not. Outcomes depend on dose, population, protocol and chance. AlphaFold works partly because its target is <em class="key">deterministic</em> — that condition simply does not transfer.</p></div>
    <div class="card"><h3>Scale is not evidence</h3><p class="small">200 million predictions with no confidence estimates and no way to check them is not infrastructure. It is noise with a search box.</p></div>
    <div class="card"><h3>What a fixed version looks like</h3><p class="small">Narrow the target to something measurable and repeatable, build or join a prospective blind evaluation, report calibrated uncertainty, and treat every output as a hypothesis for an experiment.</p></div></div>`,
  notes:`This is the transfer test for the whole lecture. Students who can criticise this proposal have understood the six layers better than any exam question would show.<br>Real proposals in this shape exist — be fair to the ambition and hard on the method.`}),

S({kind:'content', eyebrow:'Synthesis', title:'Three ideas to take away',
  html:`<div class="grid3" style="margin-top:4px">
    <div class="card"><h3>01 · The representation is the breakthrough</h3><p class="small">AlphaFold 2 was not a bigger AlphaFold 1. It changed <em class="key">what object</em> the model reasons about — sequences and pairs together, refined jointly — and that is where the accuracy came from.</p></div>
    <div class="card"><h3>02 · A benchmark is an institution</h3><p class="small">CASP made self-deception expensive for twenty-six years before the result arrived. Without it, a strong method and a well-tuned one would have looked the same.</p></div>
    <div class="card"><h3>03 · Confidence is part of the output</h3><p class="small">A prediction without uncertainty is not usable science. pLDDT is what lets a researcher decide which parts of a structure to build on and which to ignore.</p></div>
  </div>
  <div class="card" style="margin-top:16px;border-color:var(--dusk)"><h3 style="color:var(--dusk)">And the one that connects both lectures</h3>
    <p class="small">Last week: AI amplified a <b>physical</b> trace that survived in a scroll. This week: AI exploited a <b>statistical</b> trace that survived in the evolutionary record. In both cases the AI was one link in a chain, the evidence came first, and the honesty of the result depended on being able to say what was measured and what was inferred.</p></div>`,
  notes:`If you teach the two lectures back to back, this is the slide that pays off the pairing. Say the last sentence slowly.`}),

S({kind:'activity', act:'poll', eyebrow:'Exit ticket', title:'Where could the next AlphaFold come from?',
  poll:{qid:'a3', ask:'Which ingredient is <b>hardest</b> to obtain for the field you care about?',
    anon:true,
    opts:[
      {t:'Rich, open, accumulated data — a Protein Data Bank of its own', why:'Usually the binding constraint, and the slowest to fix: it needs decades and a sharing norm, not a budget.'},
      {t:'A benchmark nobody can game — a CASP of its own', why:'Cheaper to build than data, and rarer than it should be. This is often the fastest available improvement to a field.'},
      {t:'A latent structure worth predicting — a real hidden object, not a proxy', why:'Some fields have no equivalent of “the shape”. If the target is a proxy for what you care about, the whole chain inherits that gap.'},
      {t:'Experts who will check the outputs and act on them', why:'The link that decides whether a prediction becomes science or stays a leaderboard entry.'}
    ]},
  html:`<div class="card" style="margin-top:10px"><h3>On your way out — one sentence on paper</h3>
    <p class="small">Name a scientific problem that has the ingredients: <b>rich data</b>, a <b>hard latent structure</b>, and a <b>trustworthy benchmark</b>. Say which of the three is weakest.</p></div>
   <p class="credit">Core sources — AlphaFold 2, Nature (2021) ${SRC.af2} · AlphaFold 3, Nature (2024) ${SRC.af3} · CASP14 ${SRC.casp} · AlphaFold DB ${SRC.afdb} · Nobel Prize in Chemistry 2024 ${SRC.nobel}</p>`,
  notes:`Close on the opening question: AlphaFold changed the role of AI in science not because AI “knew biology”, but because it learned a representation that turned massive scientific evidence into accurate, testable predictions.<br>From <i>AI that predicts answers</i> → <i>AI that expands what science can see</i>.`});
</script>
<script>
/* =======================================================================
   ENGINE — rendering, navigation, live demos, and the activity machinery.
   ======================================================================= */
(() => {
const stage = document.getElementById('stage');
const stagewrap = document.getElementById('stagewrap');
const notesEl = document.getElementById('notes');
const overEl = document.getElementById('over');
const ACT_NAME = {predict:'Predict', poll:'Vote', pair:'Pair', debug:'Debug'};

const POLLS = {};
SLIDES.forEach((s, i) => { if (s.poll) POLLS[s.poll.qid] = { ...s.poll, slide: i }; });
const LETTERS = ['A', 'B', 'C', 'D', 'E'];
let db = null, voterId = null, session = null;

try {
  voterId = localStorage.getItem('flapdeck.voter');
  if (!voterId) { voterId = (crypto.randomUUID ? crypto.randomUUID() : 'v' + Math.random().toString(36).slice(2)); localStorage.setItem('flapdeck.voter', voterId); }
} catch (e) { voterId = 'v' + Math.random().toString(36).slice(2); }


/* ---------- scale the fixed 1280x720 stage into whatever room we have ---------- */
function fit() {
  const pad = 22;
  const w = stagewrap.clientWidth - pad * 2, h = stagewrap.clientHeight - pad * 2;
  const k = Math.max(0.2, Math.min(w / 1280, h / 720));
  stage.style.transform = `translate(${(stagewrap.clientWidth - 1280 * k) / 2}px,${(stagewrap.clientHeight - 720 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit);

/* ---------- build every slide once ---------- */
const els = [];
SLIDES.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide' + (s.kind === 'title' ? ' title-slide' : '') + (s.demo ? ' pad-tight' : '');
  d.setAttribute('aria-label', `Slide ${i + 1}: ${s.title}`);
  let inner = '';
  if (s.eyebrow && !s.act) inner += `<div class="eyebrow"><span class="tick"></span>${s.eyebrow}</div>`;
  if (s.kind !== 'title' && s.title) inner += `<h2>${s.title}</h2>`;
  inner += `<div class="body">${s.poll ? pollMarkup(s.poll) : ''}${s.html || ''}${s.reveal ? `<div data-slot="reveal"></div>` : ''}</div>`;
  d.innerHTML = inner;
  stage.appendChild(d);
  els.push(d);
});

/* ---------- reveal blocks ---------- */
SLIDES.forEach((s, i) => {
  if (!s.reveal) return;
  const slot = els[i].querySelector('[data-slot="reveal"]');
  slot.innerHTML = `<div class="ctrls" style="margin-top:8px"><button class="b dark" data-rev>Reveal the answer &nbsp;<span style="opacity:.65">R</span></button></div>
                    <div data-revbody hidden>${s.reveal}</div>`;
  slot.querySelector('[data-rev]').addEventListener('click', () => toggleReveal(i));
});
function toggleReveal(i) {
  const slot = els[i].querySelector('[data-slot="reveal"]');
  if (!slot) return;
  const body = slot.querySelector('[data-revbody]'), btn = slot.querySelector('[data-rev]');
  body.hidden = !body.hidden;
  btn.innerHTML = body.hidden ? 'Reveal the answer &nbsp;<span style="opacity:.65">R</span>' : 'Hide';
}

/* ---------- countdown timers for think-pair-share ---------- */
const timers = {};
SLIDES.forEach((s, i) => {
  if (!s.timer) return;
  const slot = els[i].querySelector('[data-slot="timer"]');
  slot.innerHTML = `<div class="timer" style="margin-top:auto">
      <span class="t" data-t>${fmt(s.timer)}</span>
      <span class="tbar"><i data-tb style="width:100%"></i></span>
      <button class="b go" data-start>Start &nbsp;<span style="opacity:.7">T</span></button>
      <button class="b" data-reset>Reset</button></div>`;
  const T = { left: s.timer, total: s.timer, id: null, el: slot };
  timers[i] = T;
  slot.querySelector('[data-start]').addEventListener('click', () => toggleTimer(i));
  slot.querySelector('[data-reset]').addEventListener('click', () => { stopTimer(i); T.left = T.total; paintTimer(i); });
});
function fmt(s) { const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function paintTimer(i) {
  const T = timers[i]; if (!T) return;
  const t = T.el.querySelector('[data-t]');
  t.textContent = fmt(Math.max(0, T.left));
  t.classList.toggle('low', T.left <= 30);
  T.el.querySelector('[data-tb]').style.width = Math.max(0, T.left / T.total * 100) + '%';
  T.el.querySelector('[data-start]').innerHTML = T.id ? 'Pause' : 'Start &nbsp;<span style="opacity:.7">T</span>';
}
function toggleTimer(i) {
  const T = timers[i]; if (!T) return;
  if (T.id) return stopTimer(i);
  T.id = setInterval(() => {
    T.left -= 1; paintTimer(i);
    if (T.left <= 0) { stopTimer(i); beep(); }
  }, 1000);
  paintTimer(i);
}
function stopTimer(i) { const T = timers[i]; if (T && T.id) { clearInterval(T.id); T.id = null; } paintTimer(i); }
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); [660, 880].forEach((f, k) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; g.gain.value = .05; o.connect(g).connect(a.destination); o.start(a.currentTime + k * .18); o.stop(a.currentTime + k * .18 + .16); }); } catch (e) {} }

/* =======================================================================
   POLLS — three ways to run, so a poll always works
   1. show of hands: tap + on any option (no network at all)
   2. live device voting: students open this page and tap "I'm a student"
   3. reveal + reasoning: always available
   ======================================================================= */
function pollMarkup(p) {
  return `<div class="act poll" data-poll="${p.qid}">
    <span class="chip"><span class="dot"></span>${p.anon ? 'Exit ticket · everyone votes' : 'Everybody votes'}</span>
    <p class="ask">${p.ask}</p>
    <div class="opts">${p.opts.map((o, k) => `
      <div class="optwrap"><button class="opt" data-opt="${k}">
        <span class="bar" style="width:0%"></span>
        <span class="lt">${LETTERS[k]}</span>
        <span><span>${o.t}</span><span class="why">${o.why}</span></span>
        <span style="display:flex;align-items:center;gap:9px">
          <span class="verdict" hidden>${o.ok ? '✓ correct' : ''}</span>
          <span class="cnt">0</span>
          <span class="b tiny" data-hand="${k}" title="record a show of hands">+</span>
        </span>
      </button></div>`).join('')}</div>
    <div class="ctrls" style="margin-top:4px">
      <button class="b dark" data-reveal>Reveal &nbsp;<span style="opacity:.65">R</span></button>
      <button class="b" data-clear>Clear votes</button>
      <span class="small" data-total>no votes yet</span>
    </div></div>`;
}

const manual = {};       // qid -> [counts] recorded by hand
const liveVotes = {};    // qid -> {voterId: choice}
const revealed = {};
let unsubVotes = null;

SLIDES.forEach((s, i) => {
  if (!s.poll) return;
  const root = els[i].querySelector('[data-poll]');
  const qid = s.poll.qid;
  manual[qid] = s.poll.opts.map(() => 0);
  liveVotes[qid] = {};
  root.querySelectorAll('[data-hand]').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation(); ev.preventDefault();
    manual[qid][+b.dataset.hand]++; paintPoll(qid);
  }));
  root.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
    // the presenter clicking an option marks it for discussion; it does not vote
    b.classList.toggle('picked');
  }));
  root.querySelector('[data-reveal]').addEventListener('click', () => setRevealed(qid, !revealed[qid]));
  root.querySelector('[data-clear]').addEventListener('click', () => clearVotes(qid));
});

function counts(qid) {
  const p = POLLS[qid], out = p.opts.map((_, k) => manual[qid][k]);
  Object.values(liveVotes[qid] || {}).forEach(c => { if (out[c] !== undefined) out[c]++; });
  return out;
}
function paintPoll(qid) {
  const p = POLLS[qid], root = els[p.slide].querySelector('[data-poll]');
  const c = counts(qid), total = c.reduce((a, b) => a + b, 0);
  root.querySelectorAll('[data-opt]').forEach((btn, k) => {
    btn.querySelector('.bar').style.width = (total ? c[k] / Math.max(1, Math.max(...c)) * 100 : 0) + '%';
    btn.querySelector('.cnt').textContent = c[k];
    btn.classList.toggle('shown', !!revealed[qid]);
    btn.classList.toggle('right', !!revealed[qid] && !!p.opts[k].ok);
    btn.classList.toggle('wrong', !!revealed[qid] && !p.opts[k].ok);
    const v = btn.querySelector('.verdict');
    v.hidden = !(revealed[qid] && p.opts[k].ok);
  });
  root.querySelector('[data-total]').textContent = total ? `${total} vote${total === 1 ? '' : 's'}` : 'no votes yet';
  root.querySelector('[data-reveal]').innerHTML = revealed[qid] ? 'Hide answers' : 'Reveal &nbsp;<span style="opacity:.65">R</span>';
  renderStudent();
}
function setRevealed(qid, on) {
  revealed[qid] = on; paintPoll(qid);
  writeSession({ qid, open: true, revealed: on });
}
async function clearVotes(qid) {
  manual[qid] = POLLS[qid].opts.map(() => 0);
  liveVotes[qid] = {}; paintPoll(qid);
  if (!db) return;
  try {
    const snap = await db.collection(`votes/${qid}/choices`).get();
    await Promise.all(snap.docs.map(d => db.doc(`votes/${qid}/choices/${d.id}`).delete().catch(() => {})));
  } catch (e) {}
}
function writeSession(patch) {
  if (!db) return;
  db.doc('session/state').set({ ...patch, ts: Date.now() }).catch(() => {});
}
function watchVotes(qid) {
  if (unsubVotes) { unsubVotes(); unsubVotes = null; }
  if (!db || !qid) return;
  try {
    unsubVotes = db.collection(`votes/${qid}/choices`).onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && typeof v.choice === 'number') m[d.id] = v.choice; });
      liveVotes[qid] = m; paintPoll(qid);
    }, () => {});
  } catch (e) {}
}
