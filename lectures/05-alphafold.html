/* =======================================================================
   LIVE DEMOS
   ======================================================================= */
const DEMOS = {};
let running = null;
function cv(host, w, h) {
  const wrap=document.createElement('div'); wrap.className='cwrap';
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  wrap.appendChild(c); host.appendChild(wrap);
  return c.getContext('2d');
}
function row(host, html){const d=document.createElement('div');d.className='row';d.innerHTML=html;host.appendChild(d);return d;}
function out(host){const d=document.createElement('div');d.className='readout';host.appendChild(d);return d;}
function loop(fn){let last=performance.now(),id=0,stop=false;
  const step=now=>{if(stop)return;let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;fn(dt,now);id=requestAnimationFrame(step);};
  id=requestAnimationFrame(step); return ()=>{stop=true;cancelAnimationFrame(id);};}
function rng(seed){let s=seed;return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};}

/* ---------- 1. the size of the search space ---------- */
DEMOS.search = host => {
  const W=440,H=190,ctx=cv(host,W,H);
  const r=row(host,`<label>residues <input type="range" id="sn" min="5" max="100" value="10"><span id="snv">10</span></label>
                    <label>shapes each <input type="range" id="sk" min="2" max="6" value="3"><span id="skv">3</span></label>`);
  const o=out(host);
  const sn=r.querySelector('#sn'), sk=r.querySelector('#sk');
  sn.addEventListener('input',()=>r.querySelector('#snv').textContent=sn.value);
  sk.addEventListener('input',()=>r.querySelector('#skv').textContent=sk.value);
  const AGE=4.35e17; // seconds since the Big Bang, near enough
  return loop(()=>{
    const n=+sn.value, k=+sk.value;
    const logTotal=n*Math.log10(k);
    ctx.fillStyle='#131A24'; ctx.fillRect(0,0,W,H);
    // a chain whose beads each show k options
    const cx=26, cy=44;
    for(let i=0;i<Math.min(n,26);i++){
      const x=cx+i*15;
      ctx.fillStyle='#B07A16'; ctx.beginPath(); ctx.arc(x,cy,5,0,6.283); ctx.fill();
      ctx.strokeStyle='rgba(176,122,22,.45)'; ctx.lineWidth=1;
      for(let j=0;j<k;j++){ const a=-1.2+j*(2.4/Math.max(1,k-1));
        ctx.beginPath(); ctx.moveTo(x,cy); ctx.lineTo(x+Math.sin(a)*11, cy+16+Math.cos(a)*4); ctx.stroke(); }
    }
    if(n>26){ctx.fillStyle='#7A8794';ctx.font='600 12px "IBM Plex Mono",monospace';ctx.fillText('… ×'+n, cx+26*15+4, cy+4);}
    // the number, drawn as a bar on a log scale
    ctx.fillStyle='#DFE6EE'; ctx.font='700 30px "Archivo",sans-serif'; ctx.textAlign='left';
    ctx.fillText(k+'^'+n, 26, 118);
    ctx.font='600 15px "IBM Plex Mono",monospace'; ctx.fillStyle='#B07A16';
    ctx.fillText('≈ 10^'+logTotal.toFixed(0)+' shapes', 26, 143);
    const frac=Math.min(1,logTotal/48);
    ctx.fillStyle='#26313F'; ctx.fillRect(26,158,W-52,10);
    ctx.fillStyle=frac>0.35?'#A33244':'#1F7A5C'; ctx.fillRect(26,158,(W-52)*frac,10);
    ctx.fillStyle='#7A8794'; ctx.font='600 10px "IBM Plex Mono",monospace';
    ctx.fillText('10^0', 26, 180); ctx.textAlign='right'; ctx.fillText('10^48', W-26, 180);
    const secs=Math.pow(10,logTotal-12); // at a trillion tries per second
    const label = secs<60 ? secs.toFixed(1)+' seconds'
      : secs<3.15e7 ? (secs/86400).toFixed(1)+' days'
      : secs<AGE ? (secs/3.15e7).toExponential(1)+' years'
      : (secs/AGE).toExponential(1)+' × the age of the universe';
    o.innerHTML=`at a <b>trillion</b> shapes per second: <b>${label}</b>`+
      (secs>AGE?`<br><span style="color:#A33244">no computer that will ever exist finishes this search</span>`:'');
  });
};

/* ---------- 2. fold a chain by satisfying contacts ---------- */
DEMOS.fold = host => {
  const W=680,H=270,ctx=cv(host,W,H);
  const r=row(host,`<button class="b tiny" id="fsh">shuffle</button><button class="b tiny" id="fcl">clear contacts</button><span id="fst"></span>`);
  const o=out(host);
  const N=16, L=21;                       // residues, ideal bond length
  let P=[], V=[], contacts=[], seed=3;
  function reset(){
    const R=rng(seed++); P=[]; V=[];
    // start as a loose, randomly kinked chain rather than a blob
    let x=60, y=135, a=(R()-0.5)*1.2;
    for(let i=0;i<N;i++){
      P.push([x,y]); V.push([0,0]);
      a += (R()-0.5)*1.5;
      x += Math.cos(a)*L; y += Math.sin(a)*L;
      if(x<30||x>320) a=Math.PI-a;
      if(y<30||y>240) a=-a;
    }
  }
  reset();
  r.querySelector('#fsh').addEventListener('click',reset);
  r.querySelector('#fcl').addEventListener('click',()=>{contacts=[];});
  // contact grid on the right
  const GX=392, GS=Math.floor((W-GX-24)/N);
  const cell=(ev)=>{
    const b=ctx.canvas.getBoundingClientRect();
    const x=(ev.clientX-b.left)*(W/b.width), y=(ev.clientY-b.top)*(H/b.height);
    const i=Math.floor((x-GX)/GS), j=Math.floor((y-30)/GS);
    if(i<0||j<0||i>=N||j>=N) return null;
    return [i,j];
  };
  const dn=ev=>{
    const c=cell(ev); if(!c)return;
    let [i,j]=c; if(Math.abs(i-j)<3) return;
    if(i>j){const t=i;i=j;j=t;}
    const k=contacts.findIndex(z=>z[0]===i&&z[1]===j);
    if(k>=0) contacts.splice(k,1); else contacts.push([i,j]);
  };
  ctx.canvas.addEventListener('pointerdown',dn);
  const stop=loop(dt=>{
    // relax: bonds hold neighbours at L, contacts pull declared pairs together, everything else pushes apart
    for(let it=0;it<4;it++){
      for(let i=0;i<N-1;i++) spring(i,i+1,L,0.55);              // bonds: fixed length
      for(let i=0;i<N-2;i++) spring(i,i+2,L*1.80,0.12);          // local stiffness: no sharp kinks
      for(const [i,j] of contacts) spring(i,j,L*1.05,0.32);      // declared contacts pull together
      for(let i=0;i<N;i++)for(let j=i+3;j<N;j++){                // everything else keeps its distance
        const d=dist(i,j); if(d<L*1.35) spring(i,j,L*1.35,0.34);
      }
    }
    for(let i=0;i<N;i++){ P[i][0]=Math.max(20,Math.min(GX-34,P[i][0])); P[i][1]=Math.max(20,Math.min(H-20,P[i][1])); }
    ctx.fillStyle='#131A24'; ctx.fillRect(0,0,W,H);
    // the chain
    ctx.strokeStyle='#4A6E8A'; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.beginPath();
    P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    ctx.strokeStyle='rgba(176,122,22,.75)'; ctx.lineWidth=1.6; ctx.setLineDash([3,3]);
    for(const [i,j] of contacts){ctx.beginPath();ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[j][0],P[j][1]);ctx.stroke();}
    ctx.setLineDash([]);
    P.forEach((p,i)=>{ ctx.fillStyle=i===0?'#1F7A5C':i===N-1?'#A33244':'#B07A16';
      ctx.beginPath(); ctx.arc(p[0],p[1],4.8,0,6.283); ctx.fill(); });
    ctx.fillStyle='#7A8794'; ctx.font='600 11px "IBM Plex Mono",monospace'; ctx.textAlign='left';
    ctx.fillText('the chain', 20, 16);
    ctx.fillText('contact map — click a cell', GX, 16);
    // grid
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const near=Math.abs(i-j)<3;
      const on=contacts.some(z=>(z[0]===i&&z[1]===j)||(z[0]===j&&z[1]===i));
      ctx.fillStyle= on?'#B07A16' : near?'#26313F' : '#1B2530';
      ctx.fillRect(GX+i*GS+1, 30+j*GS+1, GS-2, GS-2);
    }
    const spread=radius();
    o.innerHTML=`contacts declared: <b>${contacts.length}</b> &nbsp;·&nbsp; how compact the shape is: <b>${spread.toFixed(0)}</b>`+
      (contacts.length===0?`<br><span style="color:#7A8794">with no constraints the chain drifts — every shuffle gives a different shape</span>`
       :contacts.length<3?`<br><span style="color:#7A8794">still ambiguous — try shuffling and watch it settle somewhere else</span>`
       :`<br><span style="color:#1F7A5C">the constraints now dominate: shuffle and it returns to the same fold</span>`);
  });
  function dist(i,j){return Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1])||0.001;}
  function spring(i,j,target,k){
    const dx=P[j][0]-P[i][0], dy=P[j][1]-P[i][1];
    const d=Math.hypot(dx,dy)||0.001, f=(d-target)/d*k*0.5;
    P[i][0]+=dx*f; P[i][1]+=dy*f; P[j][0]-=dx*f; P[j][1]-=dy*f;
  }
  function radius(){let cx=0,cy=0;P.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=N;cy/=N;
    let s=0;P.forEach(p=>s+=Math.hypot(p[0]-cx,p[1]-cy));return s/N;}
  return ()=>{stop(); ctx.canvas.removeEventListener('pointerdown',dn);};
};

/* ---------- 3. find the coevolving columns ---------- */
DEMOS.msa = host => {
  const W=600,H=250,ctx=cv(host,W,H);
  const r=row(host,`<button class="b tiny" id="mcl">clear selection</button><span>click two columns</span>`);
  const o=out(host);
  const ROWS=14, COLS=12;
  // build an alignment where columns 3 and 8 are coupled, 5 is conserved, others vary freely
  const AA='AGSVLKRTMQ'.split('');
  const R=rng(11); const grid=[];
  for(let i=0;i<ROWS;i++){
    const row=[];
    for(let c=0;c<COLS;c++) row.push(AA[Math.floor(R()*4)]);
    row[5]='V';                                   // conserved
    const big = R()<0.5;
    row[3]= big?'W':'A';                          // coupled pair
    row[8]= big?'G':'L';
    row[10]= R()<0.5?'K':'R';                     // varies, uncoupled
    grid.push(row);
  }
  let sel=[];
  const CW=Math.floor((W-70)/COLS), CH=Math.floor((H-58)/ROWS);
  const dn=ev=>{
    const b=ctx.canvas.getBoundingClientRect();
    const x=(ev.clientX-b.left)*(W/b.width);
    const c=Math.floor((x-58)/CW);
    if(c<0||c>=COLS)return;
    if(sel.includes(c)) sel=sel.filter(z=>z!==c); else { sel.push(c); if(sel.length>2) sel.shift(); }
  };
  ctx.canvas.addEventListener('pointerdown',dn);
  r.querySelector('#mcl').addEventListener('click',()=>sel=[]);
  function coupling(a,b){
    // normalised mutual information between two columns
    const pa={},pb={},pab={};
    for(let i=0;i<ROWS;i++){const x=grid[i][a],y=grid[i][b];
      pa[x]=(pa[x]||0)+1; pb[y]=(pb[y]||0)+1; pab[x+y]=(pab[x+y]||0)+1;}
    let mi=0;
    for(const k in pab){const x=k[0],y=k[1];
      const p=pab[k]/ROWS, px=pa[x]/ROWS, py=pb[y]/ROWS;
      mi+=p*Math.log2(p/(px*py));}
    const H1=-Object.values(pa).reduce((s,n)=>s+(n/ROWS)*Math.log2(n/ROWS),0);
    const H2=-Object.values(pb).reduce((s,n)=>s+(n/ROWS)*Math.log2(n/ROWS),0);
    const denom=Math.min(H1,H2);
    return denom<0.01?0:Math.max(0,Math.min(1,mi/denom));
  }
  const stop=loop(()=>{
    ctx.fillStyle='#131A24'; ctx.fillRect(0,0,W,H);
    ctx.font='600 11px "IBM Plex Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let c=0;c<COLS;c++){
      ctx.fillStyle=sel.includes(c)?'#B07A16':'#7A8794';
      ctx.fillText(String(c), 58+c*CW+CW/2, 18);
    }
    ctx.textAlign='right';
    for(let i=0;i<ROWS;i++){ ctx.fillStyle='#4E565F'; ctx.fillText('sp '+(i+1), 50, 34+i*CH+CH/2); }
    ctx.textAlign='center';
    for(let i=0;i<ROWS;i++)for(let c=0;c<COLS;c++){
      const on=sel.includes(c);
      ctx.fillStyle=on?'rgba(176,122,22,.22)':'#1B2530';
      ctx.fillRect(58+c*CW+1, 34+i*CH+1, CW-2, CH-2);
      ctx.fillStyle=on?'#FFE9B8':'#9AA6B2';
      ctx.fillText(grid[i][c], 58+c*CW+CW/2, 34+i*CH+CH/2);
    }
    if(sel.length===2){
      const v=coupling(sel[0],sel[1]);
      const strong=v>0.6;
      o.innerHTML=`columns <b>${sel[0]}</b> and <b>${sel[1]}</b> — coupling <b>${(v*100).toFixed(0)}%</b><br>`+
        (strong?`<span style="color:#B07A16">they change in step. Hypothesis: these two positions touch in 3-D.</span>`
               :v<0.05?`<span style="color:#7A8794">no relationship — knowing one tells you nothing about the other</span>`
                      :`<span style="color:#7A8794">weak — some agreement, easily explained by chance in ${ROWS} sequences</span>`);
    } else if(sel.length===1){
      const varied=new Set(grid.map(r=>r[sel[0]])).size;
      o.innerHTML=`column <b>${sel[0]}</b> selected — ${varied===1?'<span style="color:#7A8794">perfectly conserved: it carries no pairwise information at all</span>':`${varied} different residues appear here`}<br>click a second column to test the pair`;
    } else o.innerHTML='click a column, then another, to score the pair';
  });
  return ()=>{stop(); ctx.canvas.removeEventListener('pointerdown',dn);};
};

/* ---------- 4. confidence colouring ---------- */
DEMOS.plddt = host => {
  const W=430,H=230,ctx=cv(host,W,H);
  const o=out(host);
  const N=90, R=rng(5);
  const pts=[], conf=[];
  for(let i=0;i<N;i++){
    const t=i/N;
    // a compact core with a floppy tail
    const core = t<0.72;
    const a=t*Math.PI*6.2, rad=core? 52+18*Math.sin(t*11) : 62+ (t-0.72)*260;
    pts.push([W*0.42+Math.cos(a)*rad*0.92, H*0.5+Math.sin(a)*rad*0.62 + (core?0:(t-0.72)*90)]);
    conf.push(core ? 88+10*Math.sin(t*7) : Math.max(28, 86-(t-0.72)*220));
  }
  let hov=null;
  const mv=ev=>{const b=ctx.canvas.getBoundingClientRect();
    const x=(ev.clientX-b.left)*(W/b.width), y=(ev.clientY-b.top)*(H/b.height);
    let best=null,bd=1e9;
    pts.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=i;}});
    hov = bd<18?best:null;};
  ctx.canvas.addEventListener('pointermove',mv);
  ctx.canvas.addEventListener('pointerleave',()=>hov=null);
  const col=v=> v>=90?'#2C6BB5' : v>=70?'#5FB0E8' : v>=50?'#E8C45F' : '#E07A3C';
  const stop=loop(()=>{
    ctx.fillStyle='#131A24'; ctx.fillRect(0,0,W,H);
    ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round';
    for(let i=0;i<N-1;i++){
      ctx.strokeStyle=col(conf[i]);
      ctx.beginPath(); ctx.moveTo(pts[i][0],pts[i][1]); ctx.lineTo(pts[i+1][0],pts[i+1][1]); ctx.stroke();
    }
    if(hov!==null){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(pts[hov][0],pts[hov][1],9,0,6.283); ctx.stroke(); }
    // legend
    const L=[['90–100','very high','#2C6BB5'],['70–90','confident','#5FB0E8'],['50–70','low','#E8C45F'],['<50','very low','#E07A3C']];
    ctx.font='600 10px "IBM Plex Mono",monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    L.forEach((l,i)=>{ const y=30+i*20;
      ctx.fillStyle=l[2]; ctx.fillRect(W-108,y-5,11,11);
      ctx.fillStyle='#9AA6B2'; ctx.fillText(l[0]+'  '+l[1], W-92, y); });
    o.innerHTML = hov!==null
      ? `residue <b>${hov+1}</b> &nbsp; pLDDT <b>${conf[hov].toFixed(0)}</b> — ${conf[hov]>=90?'very high':conf[hov]>=70?'confident':conf[hov]>=50?'low':'very low'}`
      : `hover the chain · the tail scores low because it is genuinely floppy — <span style="color:#7A8794">the model is right to be unsure</span>`;
  });
  return ()=>{stop(); ctx.canvas.removeEventListener('pointermove',mv);};
};

/* ---------- 5. what an RMSD looks like ---------- */
DEMOS.rmsd = host => {
  const W=430,H=230,ctx=cv(host,W,H);
  const r=row(host,`<label>error <input type="range" id="re" min="0" max="50" value="28"><span id="rev">2.8 Å</span></label>
                    <button class="b tiny" id="rp">jump to 0.96 Å</button>`);
  const o=out(host);
  const N=64, R=rng(9);
  const base=[], jitter=[];
  for(let i=0;i<N;i++){
    const t=i/N, a=t*Math.PI*5.4, rad=48+16*Math.sin(t*9);
    base.push([W/2+Math.cos(a)*rad*1.05, H/2+Math.sin(a)*rad*0.78]);
    jitter.push([R()-0.5, R()-0.5, R()-0.5]);
  }
  const sl=r.querySelector('#re');
  const setLab=()=>r.querySelector('#rev').textContent=(sl.value/10).toFixed(2)+' Å';
  sl.addEventListener('input',setLab);
  r.querySelector('#rp').addEventListener('click',()=>{sl.value=10;setLab();});
  const PX_PER_A=3.1;
  return loop(()=>{
    const err=+sl.value/10;
    ctx.fillStyle='#131A24'; ctx.fillRect(0,0,W,H);
    // experimental
    ctx.strokeStyle='#8FA3B5'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); base.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    // prediction = experimental + correlated error
    ctx.strokeStyle='#B07A16'; ctx.lineWidth=3.2; ctx.beginPath();
    base.forEach((p,i)=>{
      const s=err*PX_PER_A;
      const x=p[0]+jitter[i][0]*s*1.7 + Math.sin(i*0.4)*s*0.6;
      const y=p[1]+jitter[i][1]*s*1.7 + Math.cos(i*0.31)*s*0.6;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.stroke();
    // a carbon atom for scale
    ctx.fillStyle='rgba(143,163,181,.30)';
    ctx.beginPath(); ctx.arc(46,H-34,1.4*PX_PER_A,0,6.283); ctx.fill();
    ctx.fillStyle='#7A8794'; ctx.font='600 10px "IBM Plex Mono",monospace'; ctx.textAlign='left';
    ctx.fillText('carbon atom, 1.4 Å', 60, H-31);
    ctx.fillStyle='#8FA3B5'; ctx.fillText('■ experimental', 16, 18);
    ctx.fillStyle='#B07A16'; ctx.fillText('■ prediction', 118, 18);
    o.innerHTML=`error <b>${err.toFixed(2)} Å</b> — ${err<1.2?'<span style="color:#1F7A5C">the two chains are hard to tell apart: usable like an experimental structure</span>':err<2.2?'the fold is clearly right; fine detail is drifting':'<span style="color:#A33244">the shape survives, the details do not — no good for a binding site</span>'}`;
  });
};

/* ---------- 6. the hidden stack ---------- */
DEMOS.stack = host => {
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="chain" style="flex-direction:column;gap:6px;margin-bottom:12px">
    <div class="lk" data-k="0"><b>Open experimental data</b><span>the Protein Data Bank — 50 years of shared structures</span></div>
    <div class="lk" data-k="1"><b>Sequence data</b><span>massive evolutionary databases</span></div>
    <div class="lk" data-k="2"><b>Benchmark</b><span>CASP blind evaluation, since 1994</span></div>
    <div class="lk ai" data-k="3"><b>Representation</b><span>MSA + pair geometry + equivariance</span></div>
    <div class="lk" data-k="4"><b>Compute + engineering</b><span>training, inference, scaling</span></div>
    <div class="lk" data-k="5"><b>Human expertise</b><span>biology, chemistry, ML, infrastructure</span></div>
  </div>`;
  host.appendChild(wrap);
  const o=out(host);
  const on=[true,true,true,true,true,true];
  const FAIL=[
    'Nothing to learn from. There are no solved structures to train on, and no way to check any prediction against reality.',
    'No evolutionary signal. Coevolution disappears, and with it the clue that tells the model which positions touch.',
    'No way to know it works. A well-tuned method and a genuine breakthrough look identical, and the field cannot tell them apart for years.',
    'The clues exist but cannot be combined. This is AlphaFold 1 territory: useful, and not close to experimental accuracy.',
    'The design is publishable and untrainable. The ideas sit on paper.',
    'No one to build it, judge it, or use it. Every other layer was made by people who had to decide to share.'
  ];
  function paint(){
    wrap.querySelectorAll('.lk').forEach((e,i)=>e.classList.toggle('off',!on[i]));
    const dead=on.findIndex(v=>!v);
    o.innerHTML = dead<0
      ? `<span style="color:#1F7A5C">all six layers present — AlphaFold 2 happens</span>`
      : `<b style="color:#A33244">without this layer:</b> ${FAIL[dead]}`;
  }
  wrap.querySelectorAll('.lk').forEach(e=>e.addEventListener('click',()=>{const k=+e.dataset.k;on[k]=!on[k];paint();}));
  paint();
  return ()=>{};
};
/* =======================================================================
   NAVIGATION
   ======================================================================= */
let idx = 0;
function show(n) {
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  if (running) { running(); running = null; }
  els[idx].classList.remove('on');
  idx = n;
  const s = SLIDES[idx], el = els[idx];
  el.classList.add('on');
  document.getElementById('cur').textContent = idx + 1;
  document.getElementById('prog').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
  const tag = document.getElementById('slideTag');
  tag.textContent = s.act ? ACT_NAME[s.act] : '';
  tag.style.color = s.act ? `var(--${s.act})` : 'var(--ink-3)';
  notesEl.innerHTML = `<b>Slide ${idx + 1} · ${s.title}</b><br>${s.notes || ''}`;
  if (s.demo && DEMOS[s.demo]) {
    const host = el.querySelector('[data-slot="demo"]') || el.querySelector('.demo');
    if (host) { host.innerHTML = ''; running = DEMOS[s.demo](host); }
  }
  if (s.poll) { watchVotes(s.poll.qid); writeSession({ qid: s.poll.qid, open: true, revealed: !!revealed[s.poll.qid] }); paintPoll(s.poll.qid); }
  else { if (unsubVotes) { unsubVotes(); unsubVotes = null; } writeSession({ qid: null, open: false, revealed: false }); }
  renderStudent();
  fit();
}
const next = () => show(idx + 1), prev = () => show(idx - 1);

document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const k = ev.key;
  if (k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); prev(); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(SLIDES.length - 1);
  else if (k === 'n' || k === 'N') notesEl.classList.toggle('on'), fit();
  else if (k === 'o' || k === 'O') overEl.classList.toggle('on');
  else if (k === 'Escape') overEl.classList.remove('on');
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'r' || k === 'R') { const s = SLIDES[idx]; if (s.poll) setRevealed(s.poll.qid, !revealed[s.poll.qid]); else if (s.reveal) toggleReveal(idx); }
  else if (k === 't' || k === 'T') { if (timers[idx]) toggleTimer(idx); }
});

/* overview map */
const overList = document.getElementById('overList');
SLIDES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = s.act ? 'a-' + s.act : '';
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span>${s.title}${s.act ? ` <span class="tag" style="color:var(--${s.act})">· ${ACT_NAME[s.act]}</span>` : ''}</span>`;
  b.addEventListener('click', () => { overEl.classList.remove('on'); show(i); });
  overList.appendChild(b);
});

fit();
show(0);
})();
</script>
