/* =======================================================================
   LIVE DEMOS
   ======================================================================= */
const DEMOS = {};
let running = null;
function cv(host, w, h) {
  const wrap = document.createElement('div');
  wrap.className = 'cwrap';
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  wrap.appendChild(c); host.appendChild(wrap);
  return c.getContext('2d');
}
function row(host, html) { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = html; host.appendChild(d); return d; }
function out(host) { const d = document.createElement('div'); d.className = 'readout'; host.appendChild(d); return d; }
function loop(fn) {
  let last = performance.now(), id = 0, stop = false;
  const step = now => { if (stop) return; let dt = (now - last) / 1000; last = now; if (dt > .05) dt = .05; fn(dt, now); id = requestAnimationFrame(step); };
  id = requestAnimationFrame(step);
  return () => { stop = true; cancelAnimationFrame(id); };
}
const TF = (b) => b ? '<span class="t">true</span>' : '<span class="f">false</span>';

/* --- the game itself, used by two slides --- */
function buildGame(host, feelToggles) {
  const W = 300, H = 400, ctx = cv(host, W, H);
  const F = { tilt: true, wing: true, shake: true, sound: true };
  let ctls = null;
  if (feelToggles) {
    ctls = row(host, ['tilt', 'wing', 'shake', 'sound'].map(k =>
      `<button class="b tiny" data-f="${k}" aria-pressed="true">${k}</button>`).join(''));
    ctls.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.f; F[k] = !F[k]; b.setAttribute('aria-pressed', String(F[k]));
    }));
  }
  const info = row(host, '<span>Click the panel, then <b>Space</b> or click to fly.</span>');
  const G = 1050, FL = -360, MAXF = 430, SPACING = 175, SW = 40, GROUND = 46, BX = 78, BR = 11;
  let st = 'READY', y = H / 2, vy = 0, wing = 0, tilt = 0, stalks = [], score = 0, best = 0, t = 0, shake = 0, deadAt = 0, scroll = 0;
  const gapFor = s => Math.max(112, 150 - s * 1.2), spd = s => 110 + Math.min(34, s * 2);
  function mk(x) { const g = gapFor(score); return { x, gapY: 34 + Math.random() * (H - GROUND - 68 - g), gapH: g, passed: false }; }
  function reset() { y = H / 2 - 14; vy = 0; score = 0; stalks = []; let x = W + 120; for (let i = 0; i < 4; i++) { stalks.push(mk(x)); x += SPACING; } }
  function bleep(f, d, ty, g2, sl) { if (!F.sound) return; try { const a = bleep.a || (bleep.a = new (window.AudioContext || window.webkitAudioContext)()); const o = a.createOscillator(), gg = a.createGain(); o.type = ty; o.frequency.setValueAtTime(f, a.currentTime); if (sl) o.frequency.exponentialRampToValueAtTime(sl, a.currentTime + d); gg.gain.setValueAtTime(g2, a.currentTime); gg.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d); o.connect(gg).connect(a.destination); o.start(); o.stop(a.currentTime + d); } catch (e) {} }
  function flap() {
    if (st === 'READY') { reset(); st = 'PLAY'; }
    else if (st === 'DEAD') { if (performance.now() - deadAt > 500) { st = 'READY'; reset(); } return; }
    vy = FL; wing = 1; bleep(620, .08, 'triangle', .05, 900);
  }
  function die() { st = 'DEAD'; deadAt = performance.now(); shake = 1; best = Math.max(best, score); bleep(150, .25, 'sawtooth', .09, 60); }
  reset();
  const onKey = e => { if (e.code === 'Space' && host.closest('.slide').classList.contains('on')) { e.preventDefault(); flap(); } };
  const onClick = () => flap();
  document.addEventListener('keydown', onKey);
  host.addEventListener('pointerdown', onClick);
  const stop = loop(dt => {
    t += dt; shake = Math.max(0, shake - dt * 3);
    if (st === 'READY') { y = H / 2 - 14 + Math.sin(t * 3) * 7; wing = (Math.sin(t * 12) + 1) / 2; tilt = 0; scroll += 40 * dt; }
    else if (st === 'DEAD') { vy = Math.min(MAXF, vy + G * dt); y = Math.min(H - GROUND - BR, y + vy * dt); tilt = Math.min(1.4, tilt + 4 * dt); }
    else {
      const v = spd(score); scroll += v * dt;
      vy = Math.min(MAXF, vy + G * dt); y += vy * dt;
      wing = Math.max(0, wing - dt * 6);
      tilt += (Math.max(-.5, Math.min(1.2, vy / 430)) - tilt) * Math.min(1, dt * 10);
      for (const s of stalks) s.x -= v * dt;
      if (stalks[0].x < -SW - 20) { stalks.shift(); stalks.push(mk(stalks[stalks.length - 1].x + SPACING)); }
      for (const s of stalks) if (!s.passed && s.x + SW / 2 < BX) { s.passed = true; score++; bleep(880, .1, 'sine', .05); }
      if (y + BR >= H - GROUND || y - BR <= 0) { y = Math.max(BR, Math.min(H - GROUND - BR, y)); die(); }
      for (const s of stalks) if (BX + BR > s.x && BX - BR < s.x + SW && (y - BR < s.gapY || y + BR > s.gapY + s.gapH)) die();
    }
    // ---- draw
    ctx.save();
    if (F.shake && shake > 0) ctx.translate((Math.random() - .5) * 8 * shake, (Math.random() - .5) * 8 * shake);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#5B4478'); sky.addColorStop(.4, '#B4708A'); sky.addColorStop(.75, '#E89A72'); sky.addColorStop(1, '#F3C99B');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    const sg = ctx.createRadialGradient(220, 210, 8, 220, 210, 62);
    sg.addColorStop(0, 'rgba(255,235,195,.9)'); sg.addColorStop(1, 'rgba(255,205,145,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(220, 210, 62, 0, 6.283); ctx.fill();
    for (const s of stalks) {
      const g2 = ctx.createLinearGradient(s.x, 0, s.x + SW, 0);
      g2.addColorStop(0, '#3F6A2F'); g2.addColorStop(.4, '#7BAA52'); g2.addColorStop(1, '#2E5122');
      ctx.fillStyle = g2;
      ctx.fillRect(s.x, -6, SW, s.gapY + 6);
      ctx.fillRect(s.x, s.gapY + s.gapH, SW, H - GROUND - (s.gapY + s.gapH));
      ctx.fillStyle = '#2E5122';
      ctx.fillRect(s.x - 2, s.gapY - 5, SW + 4, 5); ctx.fillRect(s.x - 2, s.gapY + s.gapH, SW + 4, 5);
    }
    const gg = ctx.createLinearGradient(0, H - GROUND, 0, H);
    gg.addColorStop(0, '#5B3E4B'); gg.addColorStop(1, '#241A26');
    ctx.fillStyle = gg; ctx.fillRect(0, H - GROUND, W, GROUND);
    ctx.save(); ctx.translate(BX, y); if (F.tilt) ctx.rotate(tilt);
    ctx.fillStyle = '#2A2622';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-22, -7); ctx.lineTo(-16, 0); ctx.lineTo(-22, 7); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 9, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#E8A85C'; ctx.beginPath(); ctx.ellipse(2, 3, 9, 5, 0, 0, 6.283); ctx.fill();
    const wv = F.wing ? wing : .35;
    ctx.fillStyle = '#1C1916'; ctx.save(); ctx.translate(-2, -2); ctx.rotate(-.9 * wv + .35 * (1 - wv));
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-6, -14, -26, -11); ctx.quadraticCurveTo(-12, -3, -5, 5); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#F6EEE4'; ctx.beginPath(); ctx.arc(7, -3, 2.4, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1C1916'; ctx.beginPath(); ctx.arc(8, -3, 1.2, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#3A3330'; ctx.beginPath(); ctx.moveTo(13, -1.6); ctx.lineTo(19, 0); ctx.lineTo(13, 1.6); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.textAlign = 'center'; ctx.font = '700 30px "JetBrains Mono",monospace';
    ctx.fillStyle = 'rgba(27,21,34,.35)'; ctx.fillText(score, W / 2 + 1, 45);
    ctx.fillStyle = '#F6EEE4'; ctx.fillText(score, W / 2, 44);
    if (st !== 'PLAY') {
      ctx.fillStyle = 'rgba(20,16,26,.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#F6EEE4'; ctx.font = '700 22px "Bricolage Grotesque",sans-serif';
      ctx.fillText(st === 'READY' ? 'Tap to fly' : 'Down · ' + score, W / 2, H / 2);
      ctx.font = '400 12px "Source Sans 3",sans-serif'; ctx.fillStyle = '#D9CFC6';
      ctx.fillText(st === 'READY' ? 'space or click' : 'best ' + best, W / 2, H / 2 + 22);
    }
    ctx.restore();
    info.innerHTML = `<span>score <b>${score}</b> · best <b>${best}</b> · gap <b>${Math.round(gapFor(score))}px</b> · speed <b>${Math.round(spd(score))}px/s</b></span>`;
  });
  return () => { stop(); document.removeEventListener('keydown', onKey); host.removeEventListener('pointerdown', onClick); };
}
DEMOS.game = h => buildGame(h, false);
DEMOS.feel = h => buildGame(h, true);

/* --- the bare loop --- */
DEMOS.loop = host => {

/* --- per-frame vs per-second --- */
DEMOS.dt = host => {
  const W = 420, H = 250, ctx = cv(host, W, H);
  const r = row(host, `<button class="b tiny" id="dthr" aria-pressed="false">throttle to 20 fps</button>
                       <button class="b tiny" id="ddrop">drop again</button>`);
  const o = out(host);
  const G = 600, top = 30, floor = H - 26;
  let a = { y: top, v: 0, t: 0, done: 0 }, b = { y: top, v: 0, t: 0, done: 0 }, throttled = false, acc = 0, k = 0;
  const btn = r.querySelector('#dthr');
  btn.addEventListener('click', () => { throttled = !throttled; btn.setAttribute('aria-pressed', String(throttled)); btn.textContent = throttled ? 'back to full speed' : 'throttle to 20 fps'; drop(); });
  r.querySelector('#ddrop').addEventListener('click', drop);
  function drop() { a = { y: top, v: 0, t: 0, done: 0 }; b = { y: top, v: 0, t: 0, done: 0 }; acc = 0; k = 0; }
  return loop(dt => {
    acc += dt; k++;
    const skip = throttled && (k % 3 !== 0);       // pretend the machine only manages 20 fps
    if (!skip) {
      const step = acc; acc = 0;
      if (!a.done) { a.v += G * (1 / 60); a.y += a.v * (1 / 60); a.t += step; if (a.y >= floor) { a.y = floor; a.done = a.t; } }  // per frame

    }

    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.setLineDash([5, 5]);

    ctx.font = '600 12px "JetBrains Mono",monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#A3302A'; ctx.fillText('y += v      (per frame)', W * .27, 16);

    ctx.fillStyle = '#E08C82'; ctx.beginPath(); ctx.arc(W * .27, a.y, 11, 0, 6.283); ctx.fill();

      &nbsp;·&nbsp; per-second bird: <b>${b.done ? b.done.toFixed(2) + ' s' : '…falling'}</b>

  });
};

/* --- flap bench --- */
function flapBench(host, sliders) {
  const W = 330, H = 260, ctx = cv(host, W, H);

    v += G() * dt; y += v * dt;
    if (measuring) { flapT += dt; apex = Math.max(apex, flapY - y); if (y >= flapY && v > 0) { hang = flapT; measuring = false; } }
    if (y > floor) { y = floor; v = 0; measuring = false; }
    if (y < 12) { y = 12; v = 0; }
    ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(0, floor + 10, W, H - floor);
    ctx.strokeStyle = 'rgba(196,86,47,.65)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, flapY); ctx.lineTo(W, flapY); ctx.stroke();
    ctx.strokeStyle = 'rgba(46,125,91,.8)';
    ctx.beginPath(); ctx.moveTo(0, flapY - apex); ctx.lineTo(W, flapY - apex); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '500 11px "JetBrains Mono",monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#C4562F'; ctx.fillText('tap height', 6, flapY - 5);
    ctx.fillStyle = '#6BC49A'; ctx.fillText('apex', 6, flapY - apex - 5);
    ctx.fillStyle = '#E8A85C'; ctx.beginPath(); ctx.ellipse(W / 2, y, 13, 9, Math.max(-.5, Math.min(1.1, v / 430)), 0, 6.283); ctx.fill();
    const g = G(), f = -FLP();
    o.innerHTML = `predicted &nbsp; height <b>${(f * f / (2 * g)).toFixed(0)} px</b> &nbsp; hang <b>${(2 * f / g).toFixed(2)} s</b>
      <br>measured &nbsp; height <b>${apex.toFixed(0)} px</b> &nbsp; hang <b>${hang ? hang.toFixed(2) + ' s' : '—'}</b>`;
  });
  return () => { stop(); host.removeEventListener('pointerdown', onDown); };
}
DEMOS.flap = h => flapBench(h, false);
DEMOS.flap2 = h => flapBench(h, true);

/* --- stalks as data --- */
DEMOS.stalks = host => {
  const W = 360, H = 200, ctx = cv(host, W, H);
  const r = row(host, `<button class="b tiny" id="spause" aria-pressed="false">pause</button><button class="b tiny" id="sstep">step</button><span>4 objects, forever</span>`);
  const o = out(host);
  const SW = 30, SPACING = 118, GR = 22;
  let stalks = [], paused = false, stepOnce = false, recycles = 0, flash = 0;
  let x = W + 40; for (let i = 0; i < 4; i++) { stalks.push(mk(x)); x += SPACING; }
  function mk(x) { return { x, gapY: 24 + Math.random() * (H - GR - 100), gapH: 70, passed: false }; }
  const pb = r.querySelector('#spause');
  pb.addEventListener('click', () => { paused = !paused; pb.setAttribute('aria-pressed', String(paused)); pb.textContent = paused ? 'run' : 'pause'; });
  r.querySelector('#sstep').addEventListener('click', () => { stepOnce = true; });
  return loop(dt => {
    flash = Math.max(0, flash - dt * 2);
    if (!paused || stepOnce) {
      const d = stepOnce ? .05 : dt; stepOnce = false;
      for (const s of stalks) s.x -= 90 * d;
      for (const s of stalks) if (!s.passed && s.x + SW / 2 < 60) s.passed = true;
      if (stalks[0].x < -SW) { stalks.shift(); stalks.push(mk(stalks[stalks.length - 1].x + SPACING)); recycles++; flash = 1; }
    }
    ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, W, H);
    if (flash > 0) { ctx.fillStyle = `rgba(196,86,47,${flash * .25})`; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(0, H - GR, W, GR);
    stalks.forEach((s, i) => {
      ctx.fillStyle = s.passed ? '#4E7A3A' : '#7BAA52';
      ctx.fillRect(s.x, 0, SW, s.gapY); ctx.fillRect(s.x, s.gapY + s.gapH, SW, H - GR - s.gapY - s.gapH);
      ctx.fillStyle = '#E4E8EA'; ctx.font = '600 10px "JetBrains Mono",monospace'; ctx.textAlign = 'center';
      ctx.fillText('[' + i + ']', s.x + SW / 2, 12);
    });
    ctx.strokeStyle = '#C4562F'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(60, 0); ctx.lineTo(60, H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#E8A85C'; ctx.beginPath(); ctx.arc(60, H / 2, 8, 0, 6.283); ctx.fill();
    o.innerHTML = `stalks.length = <b>${stalks.length}</b> &nbsp; recycled <b>${recycles}</b>×<br>` +
      stalks.map((s, i) => `[${i}] x <b>${s.x.toFixed(0).padStart(4)}</b>  gapY <b>${s.gapY.toFixed(0).padStart(3)}</b>  passed <b>${s.passed}</b>`).join('<br>');
  });
};

/* --- collision --- */
DEMOS.collide = host => {
  const W = 340, H = 230, ctx = cv(host, W, H);
  const r = row(host, `<label>radius <input type="range" id="cr" min="4" max="26" value="12"><span id="crv">12</span></label><span>drag the bird</span>`);
  const o = out(host);
  const SX = 170, SW = 54, gapY = 78, gapH = 84;
  let bx = 90, by = 120, drag = false;
  const R = () => +r.querySelector('#cr').value;
  r.querySelector('#cr').addEventListener('input', e => r.querySelector('#crv').textContent = e.target.value);
  const pos = e => { const b = host.querySelector('canvas').getBoundingClientRect(); return [(e.clientX - b.left) * (W / b.width), (e.clientY - b.top) * (H / b.height)]; };
  const dn = e => { if (e.target.tagName === 'INPUT') return; drag = true; [bx, by] = pos(e); };
  const mv = e => { if (drag) [bx, by] = pos(e); };
  const up = () => drag = false;
  host.addEventListener('pointerdown', dn); host.addEventListener('pointermove', mv);
  addEventListener('pointerup', up);
  return (() => {
    const stop = loop(() => {
      const rr = R();
      const oxA = bx + rr > SX, oxB = bx - rr < SX + SW, overlapX = oxA && oxB;
      const above = by - rr < gapY, below = by + rr > gapY + gapH;
      const hit = overlapX && (above || below);
      ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = hit ? '#A3302A' : '#4E7A3A';
      ctx.fillRect(SX, 0, SW, gapY); ctx.fillRect(SX, gapY + gapH, SW, H - gapY - gapH);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(SX, 0); ctx.lineTo(SX, H); ctx.moveTo(SX + SW, 0); ctx.lineTo(SX + SW, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, gapY); ctx.lineTo(W, gapY); ctx.moveTo(0, gapY + gapH); ctx.lineTo(W, gapY + gapH); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#E8A85C'; ctx.beginPath(); ctx.ellipse(bx, by, 15, 10, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = hit ? '#FF6B5E' : '#6BC49A'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx, by, rr, 0, 6.283); ctx.stroke(); ctx.lineWidth = 1;
      o.innerHTML = `bird.y <b>${by.toFixed(0)}</b> &nbsp; R <b>${rr}</b> &nbsp; gapY <b>${gapY}</b>–<b>${gapY + gapH}</b><br>
        overlapX ${TF(overlapX)} &nbsp; above ${TF(above)} &nbsp; below ${TF(below)}<br>
        <b>hit = ${TF(hit)}</b>`;
    });
    return () => { stop(); host.removeEventListener('pointerdown', dn); host.removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
  })();
};

/* --- difficulty curve, drawn as the real openings --- */
DEMOS.curve = host => {
  const W = 380, H = 250, ctx = cv(host, W, H);
  const r = row(host, `<label>score <input type="range" id="qs" min="0" max="60" value="0"><span id="qsv">0</span></label>`);
  const o = out(host);
  const gapFor = s => Math.max(165, 215 - s * 1.2), spd = s => 130 + Math.min(40, s * 2);
  const sl = r.querySelector('#qs');
  sl.addEventListener('input', () => r.querySelector('#qsv').textContent = sl.value);
  return loop(() => {
    const marks = [0, 15, 30, 45, 60], k = H / 300;
    ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, W, H);
    marks.forEach((m, i) => {
      const x = 30 + i * 72, g = gapFor(m) * k, top = (H - g) / 2;
      ctx.fillStyle = m == sl.value ? '#7BAA52' : 'rgba(123,170,82,.45)';
      ctx.fillRect(x, 18, 40, top - 18); ctx.fillRect(x, top + g, 40, H - 26 - top - g);
      ctx.fillStyle = '#E4E8EA'; ctx.font = '600 11px "JetBrains Mono",monospace'; ctx.textAlign = 'center';
      ctx.fillText('score ' + m, x + 20, H - 8);
      ctx.fillStyle = '#8A9198'; ctx.fillText(Math.round(gapFor(m)) + 'px', x + 20, 13);
    });
    const s = +sl.value, g = gapFor(s) * k, top = (H - g) / 2;
    ctx.fillStyle = '#E8A85C'; ctx.beginPath(); ctx.ellipse(14, top + g / 2, 10, 7, 0, 0, 6.283); ctx.fill();
    o.innerHTML = `at score <b>${s}</b> &nbsp; gap <b>${Math.round(gapFor(s))} px</b> &nbsp; speed <b>${Math.round(spd(s))} px/s</b>
      <br><span style="color:#7E8A93">floor reached at score 42 — after that only the speed rises</span>`;
  });
};

/* =======================================================================
   NAVIGATION
   ======================================================================= */
let idx = 0;
function show(n) {
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  if (running) { running(); running = null; }
  els[idx].classList.remove('on');
  idx = n;
  const s = SLIDES[idx], el = els[idx];
  el.classList.add('on');
  document.getElementById('cur').textContent = idx + 1;
  document.getElementById('prog').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
  const tag = document.getElementById('slideTag');
  tag.textContent = s.act ? ACT_NAME[s.act] : '';
  tag.style.color = s.act ? `var(--${s.act})` : 'var(--ink-3)';
  notesEl.innerHTML = `<b>Slide ${idx + 1} · ${s.title}</b><br>${s.notes || ''}`;
  if (s.demo && DEMOS[s.demo]) {
    const host = el.querySelector('[data-slot="demo"]') || el.querySelector('.demo');
    if (host) { host.innerHTML = ''; running = DEMOS[s.demo](host); }
  }
  if (s.poll) { watchVotes(s.poll.qid); writeSession({ qid: s.poll.qid, open: true, revealed: !!revealed[s.poll.qid] }); paintPoll(s.poll.qid); }
  else { if (unsubVotes) { unsubVotes(); unsubVotes = null; } writeSession({ qid: null, open: false, revealed: false }); }
  renderStudent();
  fit();
}
const next = () => show(idx + 1), prev = () => show(idx - 1);

document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const k = ev.key;
  if (k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); prev(); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(SLIDES.length - 1);
  else if (k === 'n' || k === 'N') notesEl.classList.toggle('on'), fit();
  else if (k === 'o' || k === 'O') overEl.classList.toggle('on');
  else if (k === 'Escape') overEl.classList.remove('on');
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'r' || k === 'R') { const s = SLIDES[idx]; if (s.poll) setRevealed(s.poll.qid, !revealed[s.poll.qid]); else if (s.reveal) toggleReveal(idx); }
  else if (k === 't' || k === 'T') { if (timers[idx]) toggleTimer(idx); }
});

/* overview map */
const overList = document.getElementById('overList');
SLIDES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = s.act ? 'a-' + s.act : '';
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span>${s.title}${s.act ? ` <span class="tag" style="color:var(--${s.act})">· ${ACT_NAME[s.act]}</span>` : ''}</span>`;
  b.addEventListener('click', () => { overEl.classList.remove('on'); show(i); });
  overList.appendChild(b);
});

fit();
show(0);
})();
</script>
