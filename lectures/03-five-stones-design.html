/* =======================================================================
   LIVE DEMOS — all built on one small Five Stones core
   ======================================================================= */
const N = 15, EMPTY = 0, BLACK = 1, WHITE = 2;
const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
const inside = (r,c) => r>=0 && r<N && c>=0 && c<N;
const newBoard = () => Array.from({length:N},()=>new Array(N).fill(EMPTY));
function winsAt(b,r,c){
  const me=b[r][c]; if(!me) return null;
  const rays=[];
  for(const [dr,dc] of DIRS){
    let count=1, arms=[];
    for(const step of [1,-1]){
      let n=0, rr=r+dr*step, cc=c+dc*step;
      while(inside(rr,cc)&&b[rr][cc]===me){n++;rr+=dr*step;cc+=dc*step;}
      count+=n; arms.push(n);
    }
    rays.push({dr,dc,count,arms});
  }
  return {rays, win: rays.find(x=>x.count>=5)||null};
}
const isWin=(b,r,c)=>{const w=winsAt(b,r,c);return !!(w&&w.win);};
const PATTERNS=[
  [/(?=ooooo)/g,1000000],[/(?=_oooo_)/g,100000],
  [/(?=xoooo_|_oooox|o_ooo|oo_oo|ooo_o)/g,9000],[/(?=_ooo_)/g,5000],
  [/(?=_oo_o_|_o_oo_)/g,3500],[/(?=xooo__|__ooox|xoo_o_|_o_oox)/g,600],
  [/(?=_oo_)/g,300],[/(?=_o_o_)/g,200],[/(?=xoo__|__oox)/g,40],
];
function scoreLine(s){let t=0;for(const [re,w] of PATTERNS){const m=s.match(re); if(m) t+=m.length*w;}return t;}
function shapeValue(b,r,c,me){
  let t=0;
  for(const [dr,dc] of DIRS){
    let s='';
    for(let i=-4;i<=4;i++){
      const rr=r+dr*i, cc=c+dc*i;
      if(!inside(rr,cc)) s+='x';
      else if(i===0) s+='o';
      else if(b[rr][cc]===me) s+='o';
      else if(b[rr][cc]===EMPTY) s+='_';
      else s+='x';
    }
    t+=scoreLine(s);
  }
  return t;
}
const scoreSquare=(b,r,c,me,dw=0.9)=>shapeValue(b,r,c,me)+shapeValue(b,r,c,3-me)*dw;
function candidates(b,rad=2){
  const out=[],seen=new Set(); let any=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!b[r][c])continue; any=true;
    for(let dr=-rad;dr<=rad;dr++)for(let dc=-rad;dc<=rad;dc++){
      const rr=r+dr,cc=c+dc;
      if(!inside(rr,cc)||b[rr][cc])continue;
      const k=rr*N+cc; if(seen.has(k))continue;
      seen.add(k); out.push([rr,cc]);
    }
  }
  return any?out:[[7,7]];
}
function ruleMove(b,me){
  const them=3-me, cand=candidates(b);
  for(const [r,c] of cand){b[r][c]=me;const w=isWin(b,r,c);b[r][c]=EMPTY;if(w)return[r,c];}
  for(const [r,c] of cand){b[r][c]=them;const w=isWin(b,r,c);b[r][c]=EMPTY;if(w)return[r,c];}
  let best=cand[0],bd=1e9;
  for(const [r,c] of cand){const d=(r-7)**2+(c-7)**2; if(d<bd){bd=d;best=[r,c];}}
  return best;
}
function scoreMove(b,me,dw=0.9){
  const cand=candidates(b); let best=cand[0],bv=-1;
  for(const [r,c] of cand){const v=scoreSquare(b,r,c,me,dw); if(v>bv){bv=v;best=[r,c];}}
  return best;
}
function lookMove(b,me,dw=0.9){
  const them=3-me, cand=candidates(b);
  for(const [r,c] of cand){b[r][c]=me;const w=isWin(b,r,c);b[r][c]=EMPTY;if(w)return[r,c];}
  for(const [r,c] of cand){b[r][c]=them;const w=isWin(b,r,c);b[r][c]=EMPTY;if(w)return[r,c];}
  let best=cand[0],bv=-Infinity;
  const short=cand.map(([r,c])=>[r,c,scoreSquare(b,r,c,me,dw)]).sort((a,z)=>z[2]-a[2]).slice(0,14);
  for(const [r,c] of short){
    b[r][c]=me;
    let reply=0;
    for(const [rr,cc] of candidates(b)) reply=Math.max(reply,scoreSquare(b,rr,cc,them,dw));
    b[r][c]=EMPTY;
    const v=scoreSquare(b,r,c,me,dw)-reply;
    if(v>bv){bv=v;best=[r,c];}
  }
  return best;
}
function clubMove(b,me){
  const cand=candidates(b);
  for(const [r,c] of cand){b[r][c]=me;const w=isWin(b,r,c);b[r][c]=EMPTY;if(w)return[r,c];}
  for(const [r,c] of cand){b[r][c]=3-me;const w=isWin(b,r,c);b[r][c]=EMPTY;if(w)return[r,c];}
  const top=cand.map(([r,c])=>[r,c,scoreSquare(b,r,c,me)]).sort((a,z)=>z[2]-a[2]).slice(0,4);
  const p=top[Math.floor(Math.random()*top.length)];
  return [p[0],p[1]];
}

/* ---------- one board renderer, used by every demo ---------- */
const DEMOS = {};
let running = null;
function cv(host, w, h) {
  const wrap=document.createElement('div'); wrap.className='cwrap';
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  wrap.appendChild(c); host.appendChild(wrap);
  return c.getContext('2d');
}
function row(host, html){const d=document.createElement('div');d.className='row';d.innerHTML=html;host.appendChild(d);return d;}
function out(host){const d=document.createElement('div');d.className='readout';host.appendChild(d);return d;}
const STARS=[[3,3],[3,11],[7,7],[11,3],[11,11]];

function boardPanel(host, size=300){
  const PAD=16, STEP=(size-PAD*2)/(N-1);
  const ctx=cv(host,size,size);
  const canvas=ctx.canvas;
  const px=i=>PAD+i*STEP;
  function stone(x,y,who,alpha){
    const R=STEP*0.44;
    ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha;
    ctx.beginPath(); ctx.arc(x+1,y+1.5,R,0,6.283); ctx.fillStyle='rgba(40,20,0,.32)'; ctx.fill();
    const g=ctx.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R);
    if(who===BLACK){g.addColorStop(0,'#6a6d73');g.addColorStop(.45,'#2a2b2e');g.addColorStop(1,'#0f1012');}
    else {g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#efeadf');g.addColorStop(1,'#cbc3b1');}
    ctx.beginPath(); ctx.arc(x,y,R,0,6.283); ctx.fillStyle=g; ctx.fill(); ctx.restore();
  }
  function draw(b, overlay){
    const g=ctx.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#DFAF63'); g.addColorStop(1,'#C48F44');
    ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
    ctx.strokeStyle='#4A2E12'; ctx.lineWidth=1;
    for(let i=0;i<N;i++){
      ctx.beginPath(); ctx.moveTo(px(0),px(i)); ctx.lineTo(px(N-1),px(i)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(i),px(0)); ctx.lineTo(px(i),px(N-1)); ctx.stroke();
    }
    ctx.fillStyle='#4A2E12';
    for(const [r,c] of STARS){ctx.beginPath();ctx.arc(px(c),px(r),2.4,0,6.283);ctx.fill();}
    if(overlay) overlay({ctx,px,STEP,stone,size});
    if(b) for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(b[r][c]) stone(px(c),px(r),b[r][c]);
    if(overlay && overlay.after) overlay.after({ctx,px,STEP,stone,size});
  }
  function cellFrom(ev){
    const b=canvas.getBoundingClientRect();
    const x=(ev.clientX-b.left)*(size/b.width), y=(ev.clientY-b.top)*(size/b.height);
    const c=Math.round((x-PAD)/STEP), r=Math.round((y-PAD)/STEP);
    if(!inside(r,c)) return null;
    if(Math.abs(x-px(c))>STEP*.6||Math.abs(y-px(r))>STEP*.6) return null;
    return [r,c,x,y];
  }
  function mark(r,c,color,w){ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.strokeRect(px(c)-STEP*.45,px(r)-STEP*.45,STEP*.9,STEP*.9);ctx.lineWidth=1;}
  return {ctx,canvas,draw,px,STEP,cellFrom,stone,mark,size};
}
const COLS='ABCDEFGHIJKLMNO';
const name=(r,c)=>COLS[c]+(N-r);

/* ---------- 1. the finished game ---------- */
DEMOS.game = host => {
  const P=boardPanel(host,384);
  const ctl=row(host,`<button class="b tiny" data-lv="club">Club</button><button class="b tiny" data-lv="league" aria-pressed="true">League</button><button class="b tiny" data-lv="pro">Pro</button><button class="b tiny" data-new>new game</button>`);
  const o=out(host);
  let b=newBoard(), over=false, last=null, winLine=null, level='league', thinking=false, msg='Your move — you are black.';
  ctl.querySelectorAll('[data-lv]').forEach(x=>x.addEventListener('click',()=>{level=x.dataset.lv;ctl.querySelectorAll('[data-lv]').forEach(y=>y.setAttribute('aria-pressed',String(y===x)));}));
  ctl.querySelector('[data-new]').addEventListener('click',()=>{b=newBoard();over=false;last=null;winLine=null;msg='Your move — you are black.';paint();});
  function paint(){
    P.draw(b,Object.assign(({ctx,px,STEP})=>{
      if(winLine){ctx.save();ctx.strokeStyle='rgba(179,55,43,.55)';ctx.lineWidth=STEP*.9;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(px(winLine[0][1]),px(winLine[0][0]));ctx.lineTo(px(winLine[1][1]),px(winLine[1][0]));ctx.stroke();ctx.restore();}
    },{after:({ctx,px,STEP})=>{ if(last){ctx.fillStyle='#B3372B';ctx.beginPath();ctx.arc(px(last[1]),px(last[0]),STEP*.13,0,6.283);ctx.fill();} }}));
    o.innerHTML=msg;
  }
  function endLine(r,c){
    const w=winsAt(b,r,c); if(!w||!w.win) return null;
    const {dr,dc,arms}=w.win;
    return [[r-dr*arms[1],c-dc*arms[1]],[r+dr*arms[0],c+dc*arms[0]]];
  }
  function place(r,c,who){
    b[r][c]=who; last=[r,c];
    const L=endLine(r,c);
    if(L){over=true;winLine=L;msg=who===BLACK?'<b>You win.</b> New game?':'<b>The computer wins.</b> New game?';}
    paint();
    return over;
  }
  const onDown=ev=>{
    if(over||thinking)return;
    const cell=P.cellFrom(ev); if(!cell)return;
    const [r,c]=cell; if(b[r][c])return;
    if(place(r,c,BLACK))return;
    thinking=true; msg='Thinking…'; paint();
    setTimeout(()=>{
      const mv=level==='club'?clubMove(b,WHITE):level==='pro'?lookMove(b,WHITE,1.0):lookMove(b,WHITE);
      thinking=false; msg='Your move.';
      place(mv[0],mv[1],WHITE);
    },40);
  };
  P.canvas.addEventListener('pointerdown',onDown);
  paint();
  return ()=>P.canvas.removeEventListener('pointerdown',onDown);
};

/* ---------- 2. click -> (row, col) ---------- */
DEMOS.grid = host => {
  const P=boardPanel(host,384);
  const o=out(host);
  let hov=null, b=newBoard(); b[7][7]=BLACK; b[6][8]=WHITE;
  function paint(){
    P.draw(b,({ctx,px,STEP})=>{
      if(!hov)return;
      const [r,c,x,y]=hov;
      ctx.strokeStyle='rgba(179,55,43,.75)'; ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(P.size,y);ctx.moveTo(x,0);ctx.lineTo(x,P.size);ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle='#B3372B';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(px(c),px(r),STEP*.5,0,6.283);ctx.stroke();ctx.lineWidth=1;
    });
    o.innerHTML=hov
      ? `pixel <b>${hov[3].toFixed(0)}</b>, <b>${hov[2].toFixed(0)}</b> &nbsp;(y, x)<br>square <b>board[${hov[0]}][${hov[1]}]</b> &nbsp; = <b>${name(hov[0],hov[1])}</b><br><span style="color:#8B8275">row ${hov[0]} down · column ${hov[1]} across</span>`
      : 'move the mouse over the board';
  }
  const mv=ev=>{const cell=P.cellFrom(ev);hov=cell?[cell[0],cell[1],cell[2],cell[3]]:null;paint();};
  const lv=()=>{hov=null;paint();};
  P.canvas.addEventListener('pointermove',mv); P.canvas.addEventListener('pointerleave',lv);
  paint();
  return ()=>{P.canvas.removeEventListener('pointermove',mv);P.canvas.removeEventListener('pointerleave',lv);};
};

/* ---------- 3. the missing empty-square guard ---------- */
DEMOS.overwrite = host => {
  const P=boardPanel(host,364);
  const ctl=row(host,`<button class="b tiny" data-g aria-pressed="true">guard: on</button><button class="b tiny" data-r>reset</button><span>click to place</span>`);
  const o=out(host);
  let b=newBoard(), turn=BLACK, guard=true, eaten=0, msg='Black to play.';
  b[7][7]=WHITE; b[7][8]=WHITE; b[8][7]=WHITE;
  const gb=ctl.querySelector('[data-g]');
  gb.addEventListener('click',()=>{guard=!guard;gb.setAttribute('aria-pressed',String(guard));gb.textContent='guard: '+(guard?'on':'off');});
  ctl.querySelector('[data-r]').addEventListener('click',()=>{b=newBoard();b[7][7]=WHITE;b[7][8]=WHITE;b[8][7]=WHITE;turn=BLACK;eaten=0;msg='Black to play.';paint();});
  function paint(){P.draw(b);o.innerHTML=`${msg}<br>stones overwritten: <b>${eaten}</b>${eaten?' <span style="color:#B3372B">— those stones no longer exist</span>':''}`;}
  const dn=ev=>{
    const cell=P.cellFrom(ev); if(!cell)return;
    const [r,c]=cell;
    if(b[r][c]){ if(guard){msg='Occupied — the guard refused the move.';paint();return;} eaten++; }
    b[r][c]=turn; turn=3-turn;
    msg=(turn===BLACK?'Black':'White')+' to play.';
    if(isWin(b,r,c)) msg='<b>Five in a row.</b>';
    paint();
  };
  P.canvas.addEventListener('pointerdown',dn); paint();
  return ()=>P.canvas.removeEventListener('pointerdown',dn);
};

/* ---------- 4. the win detector, visualised ---------- */
DEMOS.win = host => {
  const P=boardPanel(host,364);
  const ctl=row(host,`<button class="b tiny" data-col aria-pressed="true">placing: black</button><button class="b tiny" data-r>clear</button>`);
  const o=out(host);
  let b=newBoard(), who=BLACK, last=null;
  const cb=ctl.querySelector('[data-col]');
  cb.addEventListener('click',()=>{who=3-who;cb.textContent='placing: '+(who===BLACK?'black':'white');});
  ctl.querySelector('[data-r]').addEventListener('click',()=>{b=newBoard();last=null;paint();});
  const NAMES=['across →','down ↓','down-right ↘','down-left ↙'];
  function paint(){
    P.draw(b,({ctx,px,STEP})=>{
      if(!last)return;
      const w=winsAt(b,last[0],last[1]); if(!w)return;
      w.rays.forEach((ray,i)=>{
        ctx.strokeStyle=ray.count>=5?'rgba(179,55,43,.85)':'rgba(46,74,125,.55)';
        ctx.lineWidth=ray.count>=5?STEP*.55:3; ctx.lineCap='round';
        const a=[last[0]-ray.dr*ray.arms[1],last[1]-ray.dc*ray.arms[1]];
        const z=[last[0]+ray.dr*ray.arms[0],last[1]+ray.dc*ray.arms[0]];
        ctx.beginPath();ctx.moveTo(px(a[1]),px(a[0]));ctx.lineTo(px(z[1]),px(z[0]));ctx.stroke();
      });
      ctx.lineWidth=1;
    });
    if(!last){o.innerHTML='click to place a stone';return;}
    const w=winsAt(b,last[0],last[1]);
    o.innerHTML=`winsAt(${last[0]}, ${last[1]}) &nbsp; last stone <b>${name(last[0],last[1])}</b><br>`+
      w.rays.map((ray,i)=>`${NAMES[i].padEnd(14)} count <b>${ray.count}</b> &nbsp;<span style="color:#8B8275">(${ray.arms[0]} forward + ${ray.arms[1]} back + 1)</span>`).join('<br>')+
      (w.win?'<br><b style="color:#B3372B">five or more — this is a win</b>':'');
  }
  const dn=ev=>{const cell=P.cellFrom(ev);if(!cell)return;const [r,c]=cell;if(b[r][c])return;b[r][c]=who;last=[r,c];paint();};
  P.canvas.addEventListener('pointerdown',dn); paint();
  return ()=>P.canvas.removeEventListener('pointerdown',dn);
};

/* ---------- 5. play the two-rule opponent ---------- */
DEMOS.rules = host => {
  const P=boardPanel(host,364);
  const ctl=row(host,`<button class="b tiny" data-r>new game</button><span>you are black</span>`);
  const o=out(host);
  let b=newBoard(), over=false, last=null, msg='Your move.', why='';
  ctl.querySelector('[data-r]').addEventListener('click',()=>{b=newBoard();over=false;last=null;msg='Your move.';why='';paint();});
  function paint(){
    P.draw(b,Object.assign(()=>{},{after:({ctx,px,STEP})=>{if(last){ctx.fillStyle='#B3372B';ctx.beginPath();ctx.arc(px(last[1]),px(last[0]),STEP*.13,0,6.283);ctx.fill();}}}));
    o.innerHTML=msg+(why?`<br><span style="color:#8B8275">rule used: ${why}</span>`:'');
  }
  function whyMove(mv){
    b[mv[0]][mv[1]]=WHITE; const win=isWin(b,mv[0],mv[1]); b[mv[0]][mv[1]]=EMPTY;
    if(win) return 'win now';
    b[mv[0]][mv[1]]=BLACK; const blk=isWin(b,mv[0],mv[1]); b[mv[0]][mv[1]]=EMPTY;
    return blk?'block now':'play near the centre';
  }
  const dn=ev=>{
    if(over)return; const cell=P.cellFrom(ev); if(!cell)return;
    const [r,c]=cell; if(b[r][c])return;
    b[r][c]=BLACK; last=[r,c];
    if(isWin(b,r,c)){over=true;msg='<b>You beat the two-rule opponent.</b>';why='';paint();return;}
    const mv=ruleMove(b,WHITE); why=whyMove(mv);
    b[mv[0]][mv[1]]=WHITE; last=mv;
    if(isWin(b,mv[0],mv[1])){over=true;msg='<b>The rule opponent wins.</b>';}
    else msg='Your move.';
    paint();
  };
  P.canvas.addEventListener('pointerdown',dn); paint();
  return ()=>P.canvas.removeEventListener('pointerdown',dn);
};

/* ---------- 6. the double threat, played out ---------- */
function forkBoard(){
  const b=newBoard();
  b[7][6]=BLACK;b[7][8]=BLACK;b[6][7]=BLACK;b[8][7]=BLACK;
  b[3][3]=WHITE;b[11][11]=WHITE;b[4][10]=WHITE;
  return b;
}
DEMOS.threat = host => {
  const P=boardPanel(host,364);
  const ctl=row(host,`<button class="b tiny" data-s>play it out</button><button class="b tiny" data-r>reset</button>`);
  const o=out(host);
  let b=forkBoard(), step=0, last=null, done=false;
  const log=[];
  function blackMove(){
    if(step===0) return [7,7];
    if(step===1) return [5,7];
    for(const cand of [[9,7],[4,7],[3,7],[10,7]]) if(!b[cand[0]][cand[1]]) return cand;
    return lookMove(b,BLACK);
  }
  function advance(){
    if(done)return;
    const mv=blackMove(); b[mv[0]][mv[1]]=BLACK; last=mv;
    log.push('black '+name(mv[0],mv[1])+(step===0?' — two open threes at once':''));
    if(isWin(b,mv[0],mv[1])){done=true;log.push('<b style="color:#B3372B">black makes five — white could only block one end</b>');paint();return;}
    const wm=ruleMove(b,WHITE); b[wm[0]][wm[1]]=WHITE; last=wm;
    log.push('white '+name(wm[0],wm[1])+' — its only rule that fires is "block a five"');
    step++; paint();
  }
  ctl.querySelector('[data-s]').addEventListener('click',advance);
  ctl.querySelector('[data-r]').addEventListener('click',()=>{b=forkBoard();step=0;last=null;done=false;log.length=0;paint();});
  function paint(){
    P.draw(b,Object.assign(({ctx,px,STEP})=>{
      if(step===0&&!last){ctx.strokeStyle='#B3372B';ctx.lineWidth=2;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.arc(px(7),px(7),STEP*.5,0,6.283);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;}
    },{after:({ctx,px,STEP})=>{if(last){ctx.fillStyle='#B3372B';ctx.beginPath();ctx.arc(px(last[1]),px(last[0]),STEP*.13,0,6.283);ctx.fill();}}}));
    o.innerHTML = log.length?log.join('<br>'):'black plays the circled square next';
  }
  paint();
  return ()=>{};
};

/* ---------- 7. what the opponent sees ---------- */
DEMOS.score = host => {
  const P=boardPanel(host,384);
  const o=out(host);
  let b=newBoard(); b[7][7]=BLACK;b[7][8]=BLACK;b[8][6]=WHITE;b[6][9]=WHITE;
  let turn=WHITE, hov=null;
  function paint(){
    const cand=candidates(b);
    let mx=1, vals=new Map();
    for(const [r,c] of cand){const v=scoreSquare(b,r,c,turn);vals.set(r*N+c,v);mx=Math.max(mx,v);}
    let bestK=null,bestV=-1; vals.forEach((v,k)=>{if(v>bestV){bestV=v;bestK=k;}});
    P.draw(b,({ctx,px,STEP})=>{
      vals.forEach((v,k)=>{
        const r=Math.floor(k/N), c=k%N;
        const a=Math.pow(v/mx,0.55)*0.72;
        ctx.fillStyle=`rgba(179,55,43,${a.toFixed(3)})`;
        ctx.fillRect(px(c)-STEP*.46,px(r)-STEP*.46,STEP*.92,STEP*.92);
      });
      if(bestK!==null){const r=Math.floor(bestK/N),c=bestK%N;
        ctx.strokeStyle='#1A1613';ctx.lineWidth=2;
        ctx.strokeRect(px(c)-STEP*.46,px(r)-STEP*.46,STEP*.92,STEP*.92);ctx.lineWidth=1;}
    });
    const who=turn===WHITE?'white':'black';
    let txt=`shading = value of that square to <b>${who}</b> · outlined = the move it would play`;
    if(hov&&!b[hov[0]][hov[1]]){
      const at=shapeValue(b,hov[0],hov[1],turn), df=shapeValue(b,hov[0],hov[1],3-turn);
      txt=`<b>${name(hov[0],hov[1])}</b> &nbsp; attack <b>${at}</b> &nbsp; defence <b>${df}</b> × 0.9<br>total <b>${(at+df*0.9).toFixed(0)}</b>`;
    }
    o.innerHTML=txt;
  }
  const mv=ev=>{const cell=P.cellFrom(ev);hov=cell?[cell[0],cell[1]]:null;paint();};
  const dn=ev=>{const cell=P.cellFrom(ev);if(!cell)return;const [r,c]=cell;if(b[r][c])return;b[r][c]=turn;turn=3-turn;paint();};
  P.canvas.addEventListener('pointermove',mv); P.canvas.addEventListener('pointerdown',dn);
  paint();
  return ()=>{P.canvas.removeEventListener('pointermove',mv);P.canvas.removeEventListener('pointerdown',dn);};
};

/* ---------- 8. the defence weight ---------- */
DEMOS.weights = host => {
  const P=boardPanel(host,364);
  const r=row(host,`<label>defence <input type="range" id="dw" min="0" max="30" value="9"><span id="dwv">0.9</span></label><button class="b tiny" data-r>new game</button>`);
  const o=out(host);
  let b=newBoard(), over=false, last=null, msg='You are black — play a move.';
  const sl=r.querySelector('#dw'), lab=r.querySelector('#dwv');
  const W=()=>+sl.value/10;
  sl.addEventListener('input',()=>{lab.textContent=W().toFixed(1);paint();});
  r.querySelector('[data-r]').addEventListener('click',()=>{b=newBoard();over=false;last=null;msg='You are black — play a move.';paint();});
  function paint(){
    P.draw(b,Object.assign(()=>{},{after:({ctx,px,STEP})=>{if(last){ctx.fillStyle='#B3372B';ctx.beginPath();ctx.arc(px(last[1]),px(last[0]),STEP*.13,0,6.283);ctx.fill();}}}));
    const w=W();
    o.innerHTML=`${msg}<br>defence weight <b>${w.toFixed(1)}</b> — ${w<0.5?'reckless: it barely notices you':w>1.6?'timid: it only answers you':'balanced'}`;
  }
  const dn=ev=>{
    if(over)return; const cell=P.cellFrom(ev); if(!cell)return;
    const [rr,cc]=cell; if(b[rr][cc])return;
    b[rr][cc]=BLACK; last=[rr,cc];
    if(isWin(b,rr,cc)){over=true;msg='<b>You win.</b>';paint();return;}
    const mv=scoreMove(b,WHITE,W()); b[mv[0]][mv[1]]=WHITE; last=mv;
    msg=isWin(b,mv[0],mv[1])?'<b>White wins.</b>':'Your move.';
    if(isWin(b,mv[0],mv[1]))over=true;
    paint();
  };
  P.canvas.addEventListener('pointerdown',dn); paint();
  return ()=>P.canvas.removeEventListener('pointerdown',dn);
};

/* ---------- 9. the greedy blind spot (a position found by playing the two opponents) ---------- */
function blindBoard(){
  const b=newBoard();
  [[5,4],[6,7],[7,7],[7,8],[8,9],[9,8]].forEach(([r,c])=>b[r][c]=BLACK);
  [[5,5],[5,6],[7,6],[8,7],[10,11]].forEach(([r,c])=>b[r][c]=WHITE);
  return b;
}
DEMOS.blindspot = host => {
  const P=boardPanel(host,364);
  const ctl=row(host,`<button class="b tiny" data-a>ask the scorer</button><button class="b tiny" data-l>ask the lookahead</button><button class="b tiny" data-p>show black's reply</button><button class="b tiny" data-r>reset</button>`);
  const o=out(host);
  let b=blindBoard(), greedy=null, look=null, reply=null;
  const G=scoreMove(blindBoard(),WHITE), L=lookMove(blindBoard(),WHITE);
  ctl.querySelector('[data-a]').addEventListener('click',()=>{greedy=G;paint();});
  ctl.querySelector('[data-l]').addEventListener('click',()=>{look=L;paint();});
  ctl.querySelector('[data-p]').addEventListener('click',()=>{
    if(!greedy){greedy=G;}
    const t=blindBoard(); t[G[0]][G[1]]=WHITE;
    let best=null,bv=-1;
    for(const [r,c] of candidates(t)){const v=scoreSquare(t,r,c,BLACK);if(v>bv){bv=v;best=[r,c];}}
    reply=best; b=t; b[best[0]][best[1]]=BLACK; paint();
  });
  ctl.querySelector('[data-r]').addEventListener('click',()=>{b=blindBoard();greedy=look=reply=null;paint();});
  function paint(){
    P.draw(b,({ctx,px,STEP})=>{
      const box=(m,col)=>{if(!m)return;ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.strokeRect(px(m[1])-STEP*.5,px(m[0])-STEP*.5,STEP,STEP);ctx.lineWidth=1;};
      box(greedy,'#B3372B'); box(look,'#1F6B5A'); box(reply,'#9A6410');
    });
    const parts=['white to move'];
    if(greedy)parts.push(`<span style="color:#B3372B">red</span> — the greedy scorer plays <b>${name(G[0],G[1])}</b> (its highest-scoring square)`);
    if(look)parts.push(`<span style="color:#1F6B5A">green</span> — one-ply lookahead plays <b>${name(L[0],L[1])}</b> instead`);
    if(reply)parts.push(`<span style="color:#9A6410">amber</span> — black answers <b>${name(reply[0],reply[1])}</b>, and now has a four that cannot be stopped`);
    o.innerHTML=parts.join('<br>');
  }
  paint();
  return ()=>{};
};

/* ---------- 10. how many squares are worth thinking about ---------- */
DEMOS.candidates = host => {
  const P=boardPanel(host,364);
  const ctl=row(host,`<button class="b tiny" data-f aria-pressed="true">filter: within 2</button><button class="b tiny" data-c>add a stone</button>`);
  const o=out(host);
  let b=blindBoard(), filtered=true;
  const fb=ctl.querySelector('[data-f]');
  fb.addEventListener('click',()=>{filtered=!filtered;fb.textContent='filter: '+(filtered?'within 2':'off — all empties');fb.setAttribute('aria-pressed',String(filtered));paint();});
  ctl.querySelector('[data-c]').addEventListener('click',()=>{const mv=lookMove(b,WHITE);b[mv[0]][mv[1]]=WHITE;paint();});
  function paint(){
    const all=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!b[r][c])all.push([r,c]);
    const set=filtered?candidates(b):all;
    P.draw(b,({ctx,px,STEP})=>{
      ctx.fillStyle='rgba(46,74,125,.30)';
      for(const [r,c] of set) ctx.fillRect(px(c)-STEP*.44,px(r)-STEP*.44,STEP*.88,STEP*.88);
    });
    const n=set.length;
    o.innerHTML=`squares the search would examine: <b>${n}</b> of ${all.length} empty<br>`+
      `two moves deep that is <b>${(n*n).toLocaleString()}</b> positions${filtered?` — instead of ${(all.length*all.length).toLocaleString()}`:''}`;
  }
  paint();
  return ()=>{};
};
/* =======================================================================
   NAVIGATION
   ======================================================================= */
let idx = 0;
function show(n) {
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  if (running) { running(); running = null; }
  els[idx].classList.remove('on');
  idx = n;
  const s = SLIDES[idx], el = els[idx];
  el.classList.add('on');
  document.getElementById('cur').textContent = idx + 1;
  document.getElementById('prog').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
  const tag = document.getElementById('slideTag');
  tag.textContent = s.act ? ACT_NAME[s.act] : '';
  tag.style.color = s.act ? `var(--${s.act})` : 'var(--ink-3)';
  notesEl.innerHTML = `<b>Slide ${idx + 1} · ${s.title}</b><br>${s.notes || ''}`;
  if (s.demo && DEMOS[s.demo]) {
    const host = el.querySelector('[data-slot="demo"]') || el.querySelector('.demo');
    if (host) { host.innerHTML = ''; running = DEMOS[s.demo](host); }
  }
  if (s.poll) { watchVotes(s.poll.qid); writeSession({ qid: s.poll.qid, open: true, revealed: !!revealed[s.poll.qid] }); paintPoll(s.poll.qid); }
  else { if (unsubVotes) { unsubVotes(); unsubVotes = null; } writeSession({ qid: null, open: false, revealed: false }); }
  renderStudent();
  fit();
}
const next = () => show(idx + 1), prev = () => show(idx - 1);

document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const k = ev.key;
  if (k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); prev(); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(SLIDES.length - 1);
  else if (k === 'n' || k === 'N') notesEl.classList.toggle('on'), fit();
  else if (k === 'o' || k === 'O') overEl.classList.toggle('on');
  else if (k === 'Escape') overEl.classList.remove('on');
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'r' || k === 'R') { const s = SLIDES[idx]; if (s.poll) setRevealed(s.poll.qid, !revealed[s.poll.qid]); else if (s.reveal) toggleReveal(idx); }
  else if (k === 't' || k === 'T') { if (timers[idx]) toggleTimer(idx); }
});

/* overview map */
const overList = document.getElementById('overList');
SLIDES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = s.act ? 'a-' + s.act : '';
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span>${s.title}${s.act ? ` <span class="tag" style="color:var(--${s.act})">· ${ACT_NAME[s.act]}</span>` : ''}</span>`;
  b.addEventListener('click', () => { overEl.classList.remove('on'); show(i); });
  overList.appendChild(b);
});

fit();
show(0);
})();
</script>
