<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleven Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* One visual world — a table under a lamp in a dark room — painted explicitly for every host theme. */
  :root {
    --room: #14161A;
    --room-2: #1D2026;
    --chalk: #EEF0EA;
    --chalk-2: #B8BCB4;
    --chalk-3: #7C817B;
    --rule: #2E323A;
    --red: #D8433A;
    --red-ink: #FFF3EF;
    --blue: #2B5EA8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--room);
    color: var(--chalk);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  .app { max-width: 1020px; margin: 0 auto; padding: 20px 20px 40px; display: grid; gap: 18px; }
  @media (max-width: 640px) { .app { padding: 10px 10px 28px; gap: 14px; } }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    font-family: "Big Shoulders Display", "Oswald", Impact, sans-serif;
    font-weight: 700; font-size: 40px; line-height: 1; margin: 0; letter-spacing: .02em; text-transform: uppercase;
  }
  h1 em { font-style: normal; color: var(--red); }
  .masthead p { margin: 0; color: var(--chalk-2); font-size: 13px; }

  canvas#table {
    display: block; width: 100%; aspect-ratio: 9 / 5; height: auto;
    border-radius: 8px;
    box-shadow: 0 50px 80px -40px rgba(0,0,0,1), 0 0 0 1px rgba(255,255,255,.05);
    cursor: none;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  canvas#table.paused, canvas#table.idle { cursor: default; }

  .bar {
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    gap: 14px 22px;
    align-items: center;
    border-top: 1px solid var(--rule);
    padding-top: 14px;
  }
  @media (max-width: 760px) { .bar { grid-template-columns: 1fr 1fr; } .bar .help { grid-column: 1 / -1; } .bar .actions { grid-column: 1 / -1; } }
  .field { display: grid; gap: 5px; }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-3); font-weight: 600; }
  .seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--room-2); }
  .seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--chalk-2); border-right: 1px solid var(--rule); white-space: nowrap; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--chalk); color: var(--room); font-weight: 500; }
  .seg button:hover:not([aria-pressed="true"]) { background: #262a31; }

  .help { font-size: 13px; color: var(--chalk-2); margin: 0; max-width: 46em; }
  .help kbd { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; background: var(--room-2); color: var(--chalk); }
  .actions { display: flex; gap: 10px; justify-self: end; }
  .btn { border: 1px solid var(--rule); background: var(--room-2); border-radius: 4px; padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn:hover { border-color: var(--chalk-3); }
  .btn.primary { background: var(--red); color: var(--red-ink); border-color: var(--red); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn[aria-pressed="true"] { border-color: var(--red); color: var(--red); }
</style>
</head><body>

<div class="app">
  <header class="masthead">
    <h1>Eleven <em>Points</em></h1>
    <p>Table-tennis scoring: first to 11, win by 2, serve changes every 2 points.</p>
  </header>

  <canvas id="table" width="900" height="500" role="img" aria-label="Table tennis table seen from above. Move your paddle to return the ball."></canvas>

  <div class="bar">
    <div class="field">
      <span class="label">Opponent</span>
      <div class="seg" role="group" aria-label="Opponent">
        <button type="button" data-mode="cpu" aria-pressed="true">Computer</button>
        <button type="button" data-mode="2p" aria-pressed="false">Two players</button>
      </div>
    </div>
    <div class="field" id="levelField">
      <span class="label">Computer skill</span>
      <div class="seg" role="group" aria-label="Computer skill">
        <button type="button" data-level="club" aria-pressed="false">Club</button>
        <button type="button" data-level="league" aria-pressed="true">League</button>
        <button type="button" data-level="pro" aria-pressed="false">Pro</button>
      </div>
    </div>
    <p class="help" id="help">You are the <strong>red</strong> paddle on the left. Move the mouse, drag a finger, or hold <kbd>W</kbd>/<kbd>S</kbd> (or <kbd>↑</kbd>/<kbd>↓</kbd>). Hit near the paddle's edge to angle the ball. <kbd>P</kbd> pauses.</p>
    <div class="actions">
      <button type="button" class="btn" id="soundBtn" aria-pressed="true">Sound on</button>
      <button type="button" class="btn primary" id="newBtn">New game</button>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 900, H = 500;
  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');

  /* ---------- tuning ---------- */
  const PAD_W = 14, PAD_H = 92, PAD_X = 46;
  const BALL_R = 8;
  const SERVE_SPEED = 380, MAX_SPEED = 860, SPEED_UP = 1.045;
  const MAX_ANGLE = Math.PI / 3;      // 60° off horizontal
  const PLAYER_SPEED = 620;           // keyboard paddle speed
  const WIN = 11;
  const LEVELS = {
    club:   { speed: 300, react: 0.28, error: 42 },
    league: { speed: 420, react: 0.16, error: 22 },
    pro:    { speed: 560, react: 0.08, error: 8 },
  };

  /* ---------- state ---------- */
  let mode = 'cpu', level = 'league', sound = true;
  try { const m = localStorage.getItem('eleven.mode'); if (m === '2p' || m === 'cpu') mode = m; } catch (e) {}
  try { const l = localStorage.getItem('eleven.level'); if (LEVELS[l]) level = l; } catch (e) {}
  try { sound = localStorage.getItem('eleven.sound') !== 'off'; } catch (e) {}

  const S = { IDLE: 0, SERVE: 1, RALLY: 2, POINT: 3, OVER: 4 };
  let state = S.IDLE, paused = false;
  const left = { y: H / 2, vy: 0, color: '#D8433A' };
  const right = { y: H / 2, vy: 0, color: '#1E1F22' };
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, spin: 0 };
  let score = [0, 0], server = 0, serveTimer = 0, pointTimer = 0, rally = 0, longest = 0;
  let t = 0, flash = 0, flashSide = 0, message = '';
  const ai = { target: H / 2, clock: 0, err: 0 };
  const keys = {};
  let pointer = { y: null, active: false };
  let trail = [];

  /* ---------- audio ---------- */
  let ac = null;
  function tone(freq, dur, type, gain, slide) {
    if (!sound) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
      g.gain.setValueAtTime(gain, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    paddle: () => tone(520, 0.06, 'square', 0.05, 380),
    wall: () => tone(300, 0.05, 'triangle', 0.05),
    point: () => tone(220, 0.35, 'sawtooth', 0.06, 110),
    win: () => { tone(660, 0.15, 'sine', 0.07); setTimeout(() => tone(880, 0.2, 'sine', 0.07), 140); setTimeout(() => tone(1320, 0.3, 'sine', 0.07), 300); },
  };

  /* ---------- rules ---------- */
  function serverFor() {
    const total = score[0] + score[1];
    if (score[0] >= WIN - 1 && score[1] >= WIN - 1) return total % 2;          // deuce: alternate each point
    return Math.floor(total / 2) % 2;                                          // otherwise every two points
  }
  function gameOver() {
    const [a, b] = score;
    return (a >= WIN || b >= WIN) && Math.abs(a - b) >= 2;
  }
  function newGame() {
    score = [0, 0]; rally = 0; longest = 0; paused = false; message = '';
    left.y = right.y = H / 2;
    beginServe();
    state = S.SERVE;
    canvas.className = '';
  }
  function beginServe() {
    server = serverFor();
    serveTimer = 0.9;
    ball.vx = ball.vy = 0; ball.spin = 0;
    ball.y = server === 0 ? left.y : right.y;
    ball.x = server === 0 ? PAD_X + PAD_W + BALL_R + 4 : W - PAD_X - PAD_W - BALL_R - 4;
    trail = [];
    rally = 0;
  }
  function launch() {
    const dir = server === 0 ? 1 : -1;
    const ang = (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(ang) * SERVE_SPEED * dir;
    ball.vy = Math.sin(ang) * SERVE_SPEED;
    state = S.RALLY;
  }
  function scorePoint(side) {
    score[side]++; sfx.point();
    flash = 1; flashSide = side;
    longest = Math.max(longest, rally);
    if (gameOver()) {
      state = S.OVER;
      const winnerName = mode === '2p' ? (side === 0 ? 'Red wins' : 'Black wins') : (side === 0 ? 'You win' : 'The computer wins');
      message = winnerName;
      sfx.win();
      canvas.className = 'idle';
    } else {
      state = S.POINT; pointTimer = 1.0;
    }
  }

  /* ---------- AI ---------- */
  function predictY(fromX, fromY, vx, vy, toX) {
    // project the ball to x = toX with wall bounces
    if (vx === 0) return fromY;
    const time = (toX - fromX) / vx;
    if (time < 0) return H / 2;
    let y = fromY + vy * time;
    const span = H - 2 * BALL_R;
    y = ((y - BALL_R) % (2 * span) + 2 * span) % (2 * span);
    if (y > span) y = 2 * span - y;
    return y + BALL_R;
  }
  function updateAI(dt) {
    const L = LEVELS[level];
    ai.clock -= dt;
    if (ai.clock <= 0) {
      ai.clock = L.react;
      if (ball.vx > 0) {
        ai.err = (Math.random() * 2 - 1) * L.error;
        ai.target = predictY(ball.x, ball.y, ball.vx, ball.vy, W - PAD_X - PAD_W) + ai.err;
        // an offset return: aim with the paddle edge sometimes
        if (level === 'pro' && Math.random() < 0.5) ai.target += (Math.random() < 0.5 ? -1 : 1) * PAD_H * 0.28;
      } else {
        ai.target = H / 2 + (ball.y - H / 2) * 0.25;
      }
    }
    const dy = ai.target - right.y;
    const step = Math.sign(dy) * Math.min(Math.abs(dy), L.speed * dt);
    right.vy = step / dt;
    right.y = clampPad(right.y + step);
  }
  function clampPad(y) { return Math.max(PAD_H / 2, Math.min(H - PAD_H / 2, y)); }

  /* ---------- update ---------- */
  function movePaddles(dt) {
    // left: pointer, or W/S, or arrows when single-player
    let lv = 0;
    if (pointer.active && pointer.y !== null) {
      const ny = clampPad(pointer.y);
      lv = (ny - left.y) / dt;
      left.y = ny;
    } else {
      if (keys.KeyW || (mode === 'cpu' && keys.ArrowUp)) lv -= PLAYER_SPEED;
      if (keys.KeyS || (mode === 'cpu' && keys.ArrowDown)) lv += PLAYER_SPEED;
      left.y = clampPad(left.y + lv * dt);
    }
    left.vy = lv;
    if (mode === '2p') {
      let rv = 0;
      if (keys.ArrowUp) rv -= PLAYER_SPEED;
      if (keys.ArrowDown) rv += PLAYER_SPEED;
      right.y = clampPad(right.y + rv * dt);
      right.vy = rv;
    } else if (state === S.RALLY || state === S.SERVE) {
      updateAI(dt);
    }
  }
  function hitPaddle(p, side) {
    const px = side === 0 ? PAD_X + PAD_W : W - PAD_X - PAD_W;
    const off = (ball.y - p.y) / (PAD_H / 2);            // -1 .. 1
    const ang = Math.max(-1, Math.min(1, off)) * MAX_ANGLE;
    let speed = Math.min(MAX_SPEED, Math.hypot(ball.vx, ball.vy) * SPEED_UP);
    const dir = side === 0 ? 1 : -1;
    ball.vx = Math.cos(ang) * speed * dir;
    ball.vy = Math.sin(ang) * speed;
    // paddle motion adds a little lift/curve
    ball.vy += p.vy * 0.18;
    ball.spin = p.vy * 0.0009;
    ball.x = side === 0 ? px + BALL_R + 1 : px - BALL_R - 1;
    rally++; sfx.paddle();
  }
  function update(dt) {
    t += dt;
    flash = Math.max(0, flash - dt * 2);
    if (state === S.IDLE || state === S.OVER) return;
    movePaddles(dt);

    if (state === S.POINT) {
      pointTimer -= dt;
      if (pointTimer <= 0) { beginServe(); state = S.SERVE; }
      return;
    }
    if (state === S.SERVE) {
      serveTimer -= dt;
      const p = server === 0 ? left : right;
      ball.y = p.y;
      ball.x = server === 0 ? PAD_X + PAD_W + BALL_R + 4 : W - PAD_X - PAD_W - BALL_R - 4;
      if (serveTimer <= 0) launch();
      return;
    }
    // rally — sub-step for fast balls
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 6);
    const h = dt / steps;
    for (let i = 0; i < steps; i++) {
      ball.vy += ball.spin * Math.abs(ball.vx) * h * 60;
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); sfx.wall(); }
      if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); sfx.wall(); }
      const lx = PAD_X + PAD_W, rx = W - PAD_X - PAD_W;
      if (ball.vx < 0 && ball.x - BALL_R <= lx && ball.x - BALL_R > lx - 30 && Math.abs(ball.y - left.y) <= PAD_H / 2 + BALL_R * 0.6) { hitPaddle(left, 0); }
      else if (ball.vx > 0 && ball.x + BALL_R >= rx && ball.x + BALL_R < rx + 30 && Math.abs(ball.y - right.y) <= PAD_H / 2 + BALL_R * 0.6) { hitPaddle(right, 1); }
      if (ball.x < -BALL_R * 3) { scorePoint(1); break; }
      if (ball.x > W + BALL_R * 3) { scorePoint(0); break; }
    }
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 10) trail.shift();
  }

  /* ---------- drawing ---------- */
  function drawTable() {
    // room
    ctx.fillStyle = '#101216'; ctx.fillRect(0, 0, W, H);
    // table surface under a lamp
    const lamp = ctx.createRadialGradient(W / 2, H * 0.35, 40, W / 2, H / 2, W * 0.62);
    lamp.addColorStop(0, '#3470C2');
    lamp.addColorStop(0.55, '#2B5EA8');
    lamp.addColorStop(1, '#1B3A6B');
    ctx.fillStyle = lamp; ctx.fillRect(0, 0, W, H);
    // light pool
    const pool = ctx.createRadialGradient(W / 2, H * 0.3, 20, W / 2, H * 0.4, W * 0.55);
    pool.addColorStop(0, 'rgba(255, 236, 200, 0.16)');
    pool.addColorStop(1, 'rgba(255, 236, 200, 0)');
    ctx.fillStyle = pool; ctx.fillRect(0, 0, W, H);
    // vignette edges
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, W * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    // lines: edge, centre line (doubles line), net
    ctx.strokeStyle = 'rgba(238, 240, 234, 0.9)';
    ctx.lineWidth = 3;
    ctx.strokeRect(8, 8, W - 16, H - 16);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(238, 240, 234, 0.55)';
    ctx.beginPath(); ctx.moveTo(8, H / 2); ctx.lineTo(W - 8, H / 2); ctx.stroke();
    // net
    ctx.fillStyle = 'rgba(238, 240, 234, 0.35)';
    for (let y = 8; y < H - 8; y += 12) ctx.fillRect(W / 2 - 2, y, 4, 7);
    ctx.fillStyle = 'rgba(238, 240, 234, 0.9)';
    ctx.fillRect(W / 2 - 4, 0, 8, 10); ctx.fillRect(W / 2 - 4, H - 10, 8, 10);
    // point flash
    if (flash > 0) {
      const g = ctx.createLinearGradient(flashSide === 0 ? 0 : W, 0, W / 2, 0);
      g.addColorStop(0, `rgba(255, 240, 210, ${0.22 * flash})`); g.addColorStop(1, 'rgba(255,240,210,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  function drawPaddle(p, side) {
    const x = side === 0 ? PAD_X : W - PAD_X - PAD_W;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.roundRect(x + 3, p.y - PAD_H / 2 + 5, PAD_W, PAD_H, 6); ctx.fill();
    // rubber face
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.roundRect(x, p.y - PAD_H / 2, PAD_W, PAD_H, 6); ctx.fill();
    // wood edge highlight
    ctx.strokeStyle = 'rgba(255, 220, 170, 0.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(x + 0.75, p.y - PAD_H / 2 + 0.75, PAD_W - 1.5, PAD_H - 1.5, 5); ctx.stroke();
    ctx.restore();
  }
  function drawBall() {
    // trail
    for (let i = 0; i < trail.length; i++) {
      const a = (i + 1) / trail.length * 0.25;
      ctx.fillStyle = `rgba(255, 250, 235, ${a})`;
      ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, BALL_R * (0.5 + 0.5 * (i + 1) / trail.length), 0, Math.PI * 2); ctx.fill();
    }
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(ball.x + 4, ball.y + 6, BALL_R, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, BALL_R);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.7, '#F6EBD0'); g.addColorStop(1, '#D9C79A');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
  }
  function drawScore() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '700 96px "Big Shoulders Display", Impact, sans-serif';
    ctx.fillStyle = 'rgba(238, 240, 234, 0.28)';
    ctx.fillText(score[0], W / 2 - 110, 112);
    ctx.fillText(score[1], W / 2 + 110, 112);
    // serve indicator
    if (state === S.SERVE || state === S.RALLY || state === S.POINT) {
      ctx.font = '600 11px "IBM Plex Sans", sans-serif';
      ctx.fillStyle = 'rgba(238, 240, 234, 0.7)';
      ctx.fillText('SERVE', server === 0 ? W / 2 - 110 : W / 2 + 110, 134);
    }
    // names
    ctx.font = '500 12px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = 'rgba(238, 240, 234, 0.55)';
    ctx.textAlign = 'left'; ctx.fillText(mode === '2p' ? 'RED  ·  W / S' : 'YOU', 22, 30);
    ctx.textAlign = 'right'; ctx.fillText(mode === '2p' ? 'BLACK  ·  ↑ / ↓' : 'COMPUTER  ·  ' + level.toUpperCase(), W - 22, 30);
    // rally counter
    if (state === S.RALLY && rally >= 4) {
      ctx.textAlign = 'center';
      ctx.font = '500 12px "IBM Plex Mono", monospace';
      ctx.fillStyle = 'rgba(238, 240, 234, 0.5)';
      ctx.fillText('rally ' + rally, W / 2, H - 22);
    }
  }
  function drawOverlay() {
    if (state === S.IDLE || state === S.OVER || paused) {
      ctx.fillStyle = 'rgba(16, 18, 22, 0.66)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#EEF0EA';
      ctx.font = '700 64px "Big Shoulders Display", Impact, sans-serif';
      let head = paused ? 'PAUSED' : state === S.OVER ? message.toUpperCase() : 'ELEVEN POINTS';
      ctx.fillText(head, W / 2, H / 2 - 10);
      ctx.font = '400 15px "IBM Plex Sans", sans-serif';
      ctx.fillStyle = '#B8BCB4';
      let sub = paused ? 'Press P to continue' : state === S.OVER ? `${score[0]} – ${score[1]}   ·   longest rally ${longest}   ·   click or press space for another game` : 'Click, tap, or press space to serve';
      ctx.fillText(sub, W / 2, H / 2 + 26);
    }
  }
  function render() {
    drawTable();
    drawPaddle(left, 0); drawPaddle(right, 1);
    if (state !== S.IDLE) drawBall();
    drawScore();
    drawOverlay();
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.04) dt = 0.04;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  function canvasY(ev) {
    const r = canvas.getBoundingClientRect();
    return (ev.clientY - r.top) * (H / r.height);
  }
  function primaryAction() {
    if (paused) { togglePause(); return; }
    if (state === S.IDLE || state === S.OVER) newGame();
  }
  function togglePause() {
    if (state === S.IDLE || state === S.OVER) return;
    paused = !paused;
    canvas.className = paused ? 'paused' : '';
    last = performance.now();
  }
  canvas.addEventListener('pointermove', ev => { pointer.y = canvasY(ev); pointer.active = true; });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; });
  canvas.addEventListener('pointerdown', ev => { ev.preventDefault(); pointer.y = canvasY(ev); pointer.active = true; primaryAction(); });
  document.addEventListener('keydown', ev => {
    if (['ArrowUp', 'ArrowDown', 'Space'].includes(ev.code)) ev.preventDefault();
    keys[ev.code] = true;
    if (ev.code === 'KeyW' || ev.code === 'KeyS' || (mode === 'cpu' && (ev.code === 'ArrowUp' || ev.code === 'ArrowDown'))) pointer.active = false;
    if (ev.code === 'Space' && !ev.repeat) primaryAction();
    if (ev.code === 'KeyP' && !ev.repeat) togglePause();
  });
  document.addEventListener('keyup', ev => { keys[ev.code] = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !paused && (state === S.SERVE || state === S.RALLY)) togglePause(); });

  const levelField = document.getElementById('levelField');
  const help = document.getElementById('help');
  function refreshSegs() {
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    document.querySelectorAll('[data-level]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === level)));
    levelField.style.visibility = mode === 'cpu' ? 'visible' : 'hidden';
    help.innerHTML = mode === 'cpu'
      ? 'You are the <strong>red</strong> paddle on the left. Move the mouse, drag a finger, or hold <kbd>W</kbd>/<kbd>S</kbd> (or <kbd>↑</kbd>/<kbd>↓</kbd>). Hit near the paddle\'s edge to angle the ball. <kbd>P</kbd> pauses.'
      : 'Two players at one keyboard: <strong>red</strong> on the left uses <kbd>W</kbd>/<kbd>S</kbd>, <strong>black</strong> on the right uses <kbd>↑</kbd>/<kbd>↓</kbd>. The mouse also moves red. <kbd>P</kbd> pauses.';
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode; right.color = '#1E1F22';
    try { localStorage.setItem('eleven.mode', mode); } catch (e) {}
    refreshSegs(); state = S.IDLE; paused = false; score = [0, 0]; canvas.className = 'idle';
  }));
  document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => {
    level = b.dataset.level;
    try { localStorage.setItem('eleven.level', level); } catch (e) {}
    refreshSegs();
  }));
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.setAttribute('aria-pressed', String(sound));
  soundBtn.textContent = sound ? 'Sound on' : 'Sound off';
  soundBtn.addEventListener('click', () => {
    sound = !sound;
    soundBtn.setAttribute('aria-pressed', String(sound));
    soundBtn.textContent = sound ? 'Sound on' : 'Sound off';
    try { localStorage.setItem('eleven.sound', sound ? 'on' : 'off'); } catch (e) {}
  });
  document.getElementById('newBtn').addEventListener('click', newGame);

  refreshSegs();
  canvas.className = 'idle';
  requestAnimationFrame(frame);
})();
</script>
</body></html>
